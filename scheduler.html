<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>VaPiq · Schedule Builder</title>
<style>
:root{
  --bg:#0F1923;--card:#1B2638;--card2:#1D2B3E;--navy:#0B1420;
  --teal:#2D8C8A;--td:#1E6665;--tl:rgba(45,140,138,.14);
  --t:#E8EEF4;--t2:#8A96A3;--t3:#4A5568;
  --b:#1F3050;--b2:#243044;--re:#E05A5A;--gr:#3D9A6B;--amber:#E8A23A;
}
[data-theme=light]{
  --bg:#EEF2F8;--card:#fff;--card2:#F5F8FC;--navy:#1B2638;
  --t:#1B2638;--t2:#4A5568;--t3:#8A96A3;--b:#DDE3ED;--b2:#EEF2F8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--t);display:flex;flex-direction:column}

/* ── TOPBAR ─────────────── */
.topbar{background:var(--navy);height:48px;display:flex;align-items:center;
  gap:10px;padding:0 14px;flex-shrink:0;border-bottom:1px solid var(--b)}
.topbar h1{font-size:15px;font-weight:800;color:#fff;flex:1}
.iBtn{background:rgba(255,255,255,.08);border:none;color:rgba(255,255,255,.7);
  width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
.iBtn:hover{background:rgba(255,255,255,.16)}

/* ── NAV BAR ────────────── */
.navbar{background:var(--card);border-bottom:1px solid var(--b);
  display:flex;align-items:center;gap:6px;padding:8px 12px;flex-shrink:0;flex-wrap:wrap}
.navlbl{flex:1;text-align:center;font-size:13px;font-weight:700;min-width:180px}
.navBtn{background:var(--card2);border:1px solid var(--b);color:var(--t2);
  border-radius:7px;padding:6px 14px;cursor:pointer;font-size:12px;font-weight:600;
  font-family:inherit;white-space:nowrap;transition:all .15s}
.navBtn:hover{border-color:var(--teal);color:var(--teal)}
.navBtn.go{background:var(--teal);border-color:var(--teal);color:#fff}
.navBtn.today{background:var(--gr);border-color:var(--gr);color:#fff}

/* ── STATUS ─────────────── */
.sbar{background:var(--card2);border-bottom:1px solid var(--b);padding:4px 14px;
  display:flex;align-items:center;gap:10px;font-size:10px;color:var(--t2);
  flex-shrink:0;flex-wrap:wrap}
.sdot{width:8px;height:8px;border-radius:50%}
.stot{margin-left:auto;font-weight:700;color:var(--t);font-size:11px}

/* ── MAIN LAYOUT ─────────── */
.layout{display:flex;flex:1;overflow:hidden;min-height:0}

/* ── SIDEBAR ─────────────── */
.sb{width:290px;min-width:290px;display:flex;flex-direction:column;
  border-right:1px solid var(--b);background:var(--card);
  transition:width .22s,min-width .22s;flex-shrink:0;overflow:hidden}
.sb.off{width:0;min-width:0}
.sbh{background:var(--navy);padding:8px 10px;display:flex;align-items:center;
  gap:7px;border-bottom:1px solid var(--b);flex-shrink:0}
.sbh h2{font-size:10px;font-weight:800;letter-spacing:.9px;
  text-transform:uppercase;color:var(--t2);flex:1;white-space:nowrap}
.badge{background:var(--teal);color:#fff;border-radius:99px;
  padding:1px 8px;font-size:11px;font-weight:700}
.sbsearch{padding:8px;flex-shrink:0;border-bottom:1px solid var(--b)}
.sbsearch input{width:100%;background:var(--bg);border:1.5px solid var(--b);
  color:var(--t);border-radius:7px;padding:7px 10px;font-size:12px;
  font-family:inherit;outline:none}
.sbsearch input:focus{border-color:var(--teal)}
.sbsearch input::placeholder{color:var(--t3)}
.addbtn{width:100%;margin-top:5px;background:var(--teal);border:none;color:#fff;
  border-radius:7px;padding:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.pool{flex:1;overflow-y:auto;padding:6px}

/* ── POOL CARD ───────────── */
.pc{background:var(--card2);border:1.5px solid var(--b);border-radius:8px;
  padding:7px 9px;margin-bottom:5px;cursor:grab;user-select:none;touch-action:none;
  transition:border-color .15s;position:relative}
.pc:hover{border-color:var(--teal)}
.pc.tsel{border-color:var(--teal);background:var(--tl)}
.pc.outw{border-style:dashed}
.pc.gsrc{opacity:.3}
.pc-name{font-size:13px;font-weight:800;color:var(--t);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.pc-meta{display:flex;align-items:center;gap:5px}
.zpill{padding:1px 6px;border-radius:99px;font-size:9px;font-weight:800;color:#fff;flex-shrink:0}
.pc-addr{font-size:10px;color:var(--t2);flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-due{font-size:9px;color:var(--t3);margin-top:3px}
.wdots{display:flex;gap:2px;margin-top:4px}
.wd{width:26px;height:18px;border-radius:4px;font-size:8px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.wd.in{background:var(--teal);color:#fff}
.wd.out{background:var(--b2);color:var(--t3)}
.wd.due{outline:2px solid var(--teal);outline-offset:1px}
.wd.tod{background:var(--gr);color:#fff}
.pool-empty{color:var(--t3);font-size:11px;text-align:center;padding:20px 8px;line-height:1.6}

/* ── GRID ────────────────── */
.ga{flex:1;overflow:auto;display:flex;flex-direction:column;position:relative}
.ctab{position:absolute;left:0;top:50%;transform:translateY(-50%);
  background:var(--teal);color:#fff;border:none;border-radius:0 6px 6px 0;
  width:14px;height:36px;cursor:pointer;font-size:9px;z-index:20;
  display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(7,minmax(175px,1fr));
  min-width:1225px;align-items:start}

/* ── DAY COLUMN ──────────── */
.dcol{display:flex;flex-direction:column;border-right:1px solid var(--b);min-height:0}
.dcol:last-child{border-right:none}
.dhdr{background:var(--card2);border-bottom:1px solid var(--b);
  padding:8px 10px;position:sticky;top:0;z-index:10;flex-shrink:0}
.dhdr.has{background:var(--tl);border-bottom-color:var(--teal)}
.dhdr.locked-hdr{background:rgba(232,162,58,.07);border-bottom-color:var(--amber)}
.dhdr.edit-hdr{background:rgba(224,90,90,.06);border-bottom-color:var(--re)}
.dh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:4px}
.dh-left .dname{font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--t2)}
.dh-left .ddate{font-size:22px;font-weight:800;color:var(--t);line-height:1}
.dh-left .ddate.today-date{color:var(--teal)}
.dh-left .dinfo{font-size:10px;color:var(--t2)}
.dh-right{display:flex;flex-direction:column;gap:3px;align-items:flex-end;flex-shrink:0}
.btn-sm{border:none;border-radius:5px;padding:3px 7px;font-size:9px;font-weight:700;
  cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s}
.btn-lock{background:rgba(232,162,58,.15);color:var(--amber);border:1px solid rgba(232,162,58,.35)}
.btn-lock:hover{background:var(--amber);color:#fff}
.btn-undo{background:rgba(224,90,90,.12);color:var(--re);border:1px solid rgba(224,90,90,.3)}
.btn-undo:hover{background:var(--re);color:#fff}
.btn-conf-day{background:linear-gradient(135deg,var(--teal),var(--td));color:#fff;
  border:none;margin-top:4px;width:100%}
.btn-conf-day:hover{opacity:.88}

/* ── DAY BODY ────────────── */
.dbody{padding:6px;min-height:140px;transition:background .15s}
.dbody.over{background:var(--tl)}

/* ── SLOT CARD ───────────── */
.sc{border-left:4px solid var(--b);border:1.5px solid var(--b);
  border-radius:7px;padding:8px 26px 7px 10px;margin-bottom:5px;
  position:relative;transition:all .15s;user-select:none;touch-action:none}
.sc.conf-sc{background:rgba(45,140,138,.08);border-left:4px solid var(--teal);
  border-color:var(--teal);cursor:default}
.sc.sugg-sc{background:var(--card2);border-left-style:solid;
  border-style:dashed;border-left-style:solid;cursor:grab}
.sc.pend-sc{background:var(--card2);cursor:grab}
.sc.edit-sc{background:rgba(232,162,58,.06);border-left:4px solid var(--amber);
  border-color:var(--amber);cursor:grab}  /* confirmed but in edit mode */
.sc.gsrc{opacity:.25}
.sc.drop-above{box-shadow:0 -3px 0 var(--teal)}
.sc.drop-below{box-shadow:0 3px 0 var(--teal)}
.sc-name{font-size:13px;font-weight:800;color:var(--t);display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.sc-row{display:flex;align-items:center;gap:5px}
.sc-zone{font-size:9px;font-weight:700;color:var(--t3)}
.sc-addr{font-size:10px;color:var(--t2);flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-time{font-size:10px;color:var(--teal);font-weight:700;display:block;margin-top:3px}
.sc-badge{font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;color:#fff;flex-shrink:0}
.badge-conf{background:var(--teal)}
.badge-lock{background:var(--amber)}
.badge-sugg{background:var(--t3)}
.sc-x{position:absolute;top:5px;right:5px;background:none;border:none;
  color:var(--t3);cursor:pointer;font-size:12px;width:18px;height:18px;
  border-radius:3px;display:flex;align-items:center;justify-content:center}
.sc-x:hover{background:var(--re);color:#fff}
.rh{position:absolute;right:5px;bottom:5px;color:var(--t3);font-size:9px;cursor:grab;
  user-select:none;touch-action:none}
.drop-hint{border:1.5px dashed var(--b);border-radius:7px;color:var(--t3);
  font-size:10px;text-align:center;padding:16px 6px;line-height:1.5}

/* ── CONFIRM BAR ──────────── */
.cbar{background:var(--navy);border-top:1px solid var(--b);
  padding:10px 14px;display:flex;gap:8px;align-items:center;flex-shrink:0}
.time-in{background:var(--card2);border:1.5px solid var(--b);color:var(--t);
  border-radius:7px;padding:7px 9px;font-size:13px;font-family:inherit;
  font-weight:700;width:90px;text-align:center}
.conf-all-btn{flex:1;background:linear-gradient(135deg,var(--teal),var(--td));
  border:none;color:#fff;border-radius:9px;padding:11px;font-size:14px;
  font-weight:700;cursor:pointer;font-family:inherit}
.conf-all-btn:disabled{opacity:.4;cursor:not-allowed}
.undo-wk-btn{background:rgba(224,90,90,.12);border:1.5px solid rgba(224,90,90,.35);
  color:var(--re);border-radius:9px;padding:11px 14px;font-size:12px;
  font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.undo-wk-btn:hover{background:var(--re);color:#fff;border-color:var(--re)}

/* ── GHOST ───────────────── */
.ghost{position:fixed;pointer-events:none;z-index:9999;padding:6px 12px;
  border-radius:8px;color:#fff;font-size:12px;font-weight:700;opacity:.85;
  box-shadow:0 8px 24px rgba(0,0,0,.5);transform:translate(-50%,-50%);
  white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}

/* ── TOAST ───────────────── */
.toast{position:fixed;bottom:74px;left:50%;
  transform:translateX(-50%) translateY(60px);background:#0B1420;color:#fff;
  padding:10px 20px;border-radius:11px;font-size:13px;font-weight:600;
  transition:transform .28s;z-index:9999;box-shadow:0 6px 24px rgba(0,0,0,.6);
  pointer-events:none;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}

/* ── AUTH ────────────────── */
.auth{display:none;position:fixed;inset:0;background:var(--bg);
  align-items:center;justify-content:center;flex-direction:column;
  gap:14px;padding:32px;z-index:200;text-align:center}
.auth.show{display:flex}
.auth h2{font-size:20px;font-weight:800}
.auth p{font-size:14px;color:var(--t2);max-width:300px;line-height:1.6}
.auth a{color:var(--teal);font-weight:700;text-decoration:none}

@media(max-width:700px){
  .layout{flex-direction:column}
  .sb{width:100%!important;min-width:100%!important;max-height:220px;
    border-right:none;border-bottom:1px solid var(--b)}
  .sb.off{max-height:0!important;overflow:hidden}
  .grid{min-width:1225px}
  .ctab{display:none}
}
</style>
</head>
<body>

<div class="auth" id="authScr">
  <div style="font-size:48px">📅</div>
  <h2>Sign in required</h2>
  <p>Please sign in to VaPiq first.</p>
  <a href="./index.html">← Back to VaPiq</a>
</div>

<div class="topbar">
  <h1>📅 Schedule Builder</h1>
  <button class="iBtn" id="sbtgl" onclick="toggleSB()">☰</button>
  <button class="iBtn" onclick="toggleTheme()">🌙</button>
  <a class="iBtn" href="./index.html" title="Back to VaPiq">🏠</a>
</div>

<div class="navbar">
  <button class="navBtn" onclick="nav(-7)">← 7 days</button>
  <button class="navBtn" onclick="nav(-1)">← 1 day</button>
  <div class="navlbl" id="navlbl">—</div>
  <button class="navBtn" onclick="nav(1)">1 day →</button>
  <button class="navBtn" onclick="nav(7)">7 days →</button>
  <button class="navBtn today" onclick="navToday()">Today</button>
  <button class="navBtn go" onclick="reload()">⟳ Reload</button>
</div>

<div class="sbar">
  <span style="display:flex;align-items:center;gap:4px">
    <div class="sdot" style="background:var(--teal)"></div>Confirmed (locked)
  </span>
  <span style="display:flex;align-items:center;gap:4px">
    <div class="sdot" style="background:var(--amber)"></div>Confirmed (editing)
  </span>
  <span style="display:flex;align-items:center;gap:4px">
    <div class="sdot" style="background:var(--t3)"></div>Suggested
  </span>
  <span style="display:flex;align-items:center;gap:4px">
    <div class="sdot" style="background:var(--b2)"></div>Pending
  </span>
  <div class="stot" id="stot"></div>
</div>

<div class="layout">
  <div class="sb" id="sb">
    <div class="sbh">
      <h2>Eligible Pool</h2>
      <div class="badge" id="poolBadge">0</div>
      <button class="iBtn" onclick="toggleSB()" style="margin-left:auto;width:26px;height:26px;font-size:11px">◀</button>
    </div>
    <div class="sbsearch">
      <input id="sq" type="search" placeholder="Search name, file#, address…" oninput="onSearch(this.value)">
      <button class="addbtn" onclick="addOutside()">+ Add patient outside window</button>
    </div>
    <div class="pool" id="pool"></div>
  </div>

  <div class="ga" id="ga">
    <button class="ctab" id="ctab" onclick="toggleSB()">◀</button>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="cbar">
  <input class="time-in" id="st" type="time" value="08:00" onchange="renderGrid()">
  <button class="conf-all-btn" id="cab" onclick="confirmAll()" disabled>✓ Confirm All Unconfirmed</button>
  <button class="undo-wk-btn" onclick="undoWindow()">↩ Undo Window</button>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ════════════════════════════════════════════════════════════
// CONSTANTS
// ════════════════════════════════════════════════════════════
const SB_URL = 'https://wqlbmtjbjloxpvsbeqyb.supabase.co';
const SB_KEY = 'sb_publishable_gcyK2z_8lvbOgHNcJfdX1g_8QCWJ_Xi';
const WIN    = 3;   // ±days eligibility window
const SLOT   = 30;  // minutes per slot
const DAYS   = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MFULL  = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

// ════════════════════════════════════════════════════════════
// ZONE CONFIG
// ════════════════════════════════════════════════════════════
const FSA = {H7:'Laval',H8:'West Island',H9:'West Island',H3:'Mtl West',
  H4:'Mtl West',H2:'Montréal',H1:'Mtl North',H5:'Mtl East',H6:'Mtl East',
  J4:'South Shore',J5:'South Shore',J3:'Longueuil',J6:'Lanaudière',
  J7:'Laurentians',J8:'Nord'};
const ZC = {'Laval':'#8B5BE8','West Island':'#5B73E8','Mtl West':'#2D8C8A',
  'Montréal':'#1E6665','Mtl North':'#3D9A6B','Mtl East':'#4AA8A0',
  'South Shore':'#E87A5B','Longueuil':'#D4673E','Lanaudière':'#8A96A3',
  'Laurentians':'#6B7A8F','Nord':'#4A5568','Unknown':'#556070'};
function zoneOf(p){
  const a=(p.address||'').toUpperCase();
  const m=a.match(/[A-Z]\d[A-Z]\s*\d[A-Z]\d/);
  if(m){const f=m[0].replace(/\s/,'').slice(0,2);const n=FSA[f]||'Unknown';return{n,c:ZC[n]||ZC.Unknown};}
  const l=(p.address||'').toLowerCase();
  if(/laval/.test(l))       return{n:'Laval',      c:ZC['Laval']};
  if(/pointe.claire|dorval|beaconsfield|dollard|kirkland/.test(l))
                             return{n:'West Island',c:ZC['West Island']};
  if(/longueuil/.test(l))   return{n:'Longueuil',  c:ZC['Longueuil']};
  if(/brossard|laprairie|boucherville/.test(l))
                             return{n:'South Shore',c:ZC['South Shore']};
  if(/blainville|saint.jerome|boisbriand|rosemere/.test(l))
                             return{n:'Laurentians',c:ZC['Laurentians']};
  return{n:'Montréal',c:ZC['Montréal']};
}

// ════════════════════════════════════════════════════════════
// DATE HELPERS  (local time only — no UTC conversion)
// ════════════════════════════════════════════════════════════
function toYMD(d){
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
}
function fromYMD(s){
  // Parse YYYY-MM-DD as LOCAL date (not UTC)
  const[y,m,d]=s.split('-').map(Number);
  return new Date(y,m-1,d);
}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function p2(n){return String(n).padStart(2,'0');}
function todayYMD(){return toYMD(new Date());}
function dayDiff(a,b){
  // Difference in whole days between two YYYY-MM-DD strings
  return Math.round((fromYMD(a)-fromYMD(b))/86400000);
}

// ════════════════════════════════════════════════════════════
// STATE  —  source of truth is always the DB
//
//  windowStart : string YYYY-MM-DD (first of 7 visible days)
//  allPats     : all active patients from DB (reloaded on every nav)
//  days[0..6]  : per-day state derived on load
//    .conf[]   : patients with appointment_confirmed=true on this day (from DB)
//    .active[] : unconfirmed patients placed here (in-memory only)
//                each patient may have _sugg:true (auto-suggested)
//    .editMode : bool — whether locked confirmed patients are editable
//  pool        : eligible patients not yet placed
// ════════════════════════════════════════════════════════════
let _sb = null;
let windowStart = '';   // YYYY-MM-DD
let allPats = [];
let days = mkDays();
let pool = [];
let sbOpen = true;

function mkDays(){
  return Array.from({length:7},()=>({conf:[],active:[],editMode:false}));
}

// ════════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded',async()=>{
  _sb = window.supabase.createClient(SB_URL,SB_KEY);
  const{data:{session}}=await _sb.auth.getSession();
  if(!session){document.getElementById('authScr').classList.add('show');return;}
  const saved=localStorage.getItem('vapiq_sched_theme')
    ||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
  document.documentElement.setAttribute('data-theme',saved);
  windowStart=todayYMD();
  await reload();
});

// ════════════════════════════════════════════════════════════
// RELOAD  —  fetch DB, rebuild grid from scratch
//            NEVER touches already-confirmed appointment data
// ════════════════════════════════════════════════════════════
async function reload(){
  updateNavLabel();
  const lb=document.querySelector('.navBtn.go');
  if(lb){lb.textContent='Loading…';lb.disabled=true;}
  try{
    const{data,error}=await _sb.from('patients').select('*')
      .eq('archived',false).eq('pending',false);
    if(error)throw error;
    allPats=data||[];

    // Reset per-day state
    days=mkDays();
    pool=[];
    const winDates=windowDates();  // ['2026-06-09','2026-06-10',...]

    // ── Step 1: Load CONFIRMED appointments from DB into their day column
    //            These are IMMUTABLE until user clicks Edit on that day
    const confirmedIds=new Set();
    allPats.forEach(p=>{
      if(!p.appointment_confirmed||!p.appointment_date_time)return;
      // Extract local date from stored datetime
      // appointment_date_time stored as "YYYY-MM-DDTHH:MM" (local, no timezone)
      const storedDate=p.appointment_date_time.substring(0,10);
      const idx=winDates.indexOf(storedDate);
      if(idx>=0){
        days[idx].conf.push({...p});
        confirmedIds.add(p.id);
      }
    });
    // Sort confirmed slots by stored appointment time
    days.forEach(d=>d.conf.sort((a,b)=>
      (a.appointment_date_time||'').localeCompare(b.appointment_date_time||'')));

    // ── Step 2: Smart-suggest eligible unconfirmed patients
    //            into their best matching day (closest to due date)
    const wStart=fromYMD(winDates[0]);
    const wEnd  =fromYMD(winDates[6]);
    const eligFrom=addDays(wStart,-WIN);
    const eligTo  =addDays(wEnd,   WIN);
    const suggestedIds=new Set();

    allPats
      .filter(p=>{
        if(confirmedIds.has(p.id)||!p.due_date)return false;
        const due=fromYMD(p.due_date);
        return due>=eligFrom&&due<=eligTo;
      })
      .forEach(p=>{
        const best=bestDayIdx(p.due_date,winDates);
        if(best>=0){
          days[best].active.push({...p,_sugg:true});
          suggestedIds.add(p.id);
        } else {
          pool.push({...p,_sugg:false});
        }
      });

    // ── Step 3: Pool = eligible patients not placed anywhere
    allPats.forEach(p=>{
      if(confirmedIds.has(p.id)||suggestedIds.has(p.id))return;
      if(!p.due_date)return;
      const due=fromYMD(p.due_date);
      if(due>=eligFrom&&due<=eligTo)pool.push({...p,_sugg:false});
    });

    sortPool();
    renderPool();
    renderGrid();
    const cCount=confirmedIds.size,sCount=suggestedIds.size;
    toast(`✓ ${cCount} confirmed · ${sCount} suggested`);
  }catch(e){toast('Error: '+e.message,4000);}
  if(lb){lb.textContent='⟳ Reload';lb.disabled=false;}
}

// ════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════
function windowDates(){
  return Array.from({length:7},(_,i)=>toYMD(addDays(fromYMD(windowStart),i)));
}
function bestDayIdx(dueStr,winDates){
  let best=-1,bestD=Infinity;
  winDates.forEach((d,i)=>{
    const diff=Math.abs(dayDiff(d,dueStr));
    if(diff<=WIN&&diff<bestD){bestD=diff;best=i;}
  });
  return best;
}
function isAssigned(id){
  return days.some(d=>[...d.conf,...d.active].some(p=>p.id===id));
}
function sortPool(){
  pool.sort((a,b)=>{
    const za=zoneOf(a).n,zb=zoneOf(b).n;
    if(za!==zb)return za.localeCompare(zb);
    return(a.due_date||'').localeCompare(b.due_date||'');
  });
}
function getStartMin(){
  const[h,m]=(document.getElementById('st').value||'08:00').split(':').map(Number);
  return h*60+m;
}
function calcTime(dayIdx,slotIdx){
  // slotIdx is position among ALL patients in the day (conf + active)
  const tm=getStartMin()+slotIdx*SLOT;
  return p2(Math.floor(tm/60))+':'+p2(tm%60);
}

// ════════════════════════════════════════════════════════════
// RENDER POOL
// ════════════════════════════════════════════════════════════
let searchMode=false,searchList=[];
function renderPool(){
  const el=document.getElementById('pool');
  const list=searchMode?searchList:pool;
  document.getElementById('poolBadge').textContent=pool.length;
  if(!list.length){
    el.innerHTML='<div class="pool-empty">'+(searchMode?'No patients found.':'All eligible patients suggested.')+
      '<br><small style="color:var(--t3)">Use search to add others</small></div>';
    return;
  }
  const tod=todayYMD();
  const winD=windowDates();
  el.innerHTML=list.map(p=>{
    const z=zoneOf(p),nm=p.patient_name||'',fi=p.file_number||'';
    const addr=(p.address||'').split(',')[0];
    const due=p.due_date||'';
    let dots='';
    winD.forEach((d,i)=>{
      const diff=due?dayDiff(d,due):99;
      const cls=d===tod?'tod':(Math.abs(diff)<=WIN?'in':'out');
      dots+=`<div class="wd ${cls}${diff===0?' due':''}">${DAYS[i][0]}</div>`;
    });
    const outside=!pool.some(pp=>pp.id===p.id)&&!isAssigned(p.id);
    return`<div class="pc${outside?' outw':''}" data-pid="${p.id}">
      <div class="pc-name">${esc(nm)}</div>
      <div class="pc-meta">
        <span class="zpill" style="background:${z.c}">${z.n}</span>
        <span class="pc-addr">${esc(addr)}</span>
      </div>
      ${due?`<div class="pc-due">Due ${due}${outside?' · ⚠ Outside window':''}</div>`:''}
      <div class="wdots">${dots}</div>
    </div>`;
  }).join('');
  // Attach pointer drag to pool cards
  el.querySelectorAll('.pc').forEach(el=>ptDown(el,'pool'));
}

// ════════════════════════════════════════════════════════════
// RENDER GRID
// ════════════════════════════════════════════════════════════
function renderGrid(){
  const grid=document.getElementById('grid');
  const winD=windowDates();
  const tod=todayYMD();
  let totalUnconf=0;
  let html='';

  for(let i=0;i<7;i++){
    const ds=winD[i];
    const d=fromYMD(ds);
    const {conf,active,editMode}=days[i];
    const isToday=ds===tod;
    const total=conf.length+active.length;
    totalUnconf+=active.length;

    // Day header class
    const hdrCls=editMode?'dhdr edit-hdr':conf.length?'dhdr locked-hdr has':'dhdr'+(active.length?' has':'');

    // Header buttons
    let hdrBtns='';
    if(conf.length){
      hdrBtns+=`<button class="btn-sm btn-lock" onclick="toggleEdit(${i})">
        ${editMode?'🔓 Editing':'🔒 Edit'}</button>`;
    }
    if(total>0){
      hdrBtns+=`<button class="btn-sm btn-undo" onclick="undoDay(${i})">↩ Undo</button>`;
    }
    if(active.length>0){
      hdrBtns+=`<button class="btn-sm btn-conf-day" onclick="confirmDay(${i})">
        ✓ Confirm (${active.length})</button>`;
    }

    html+=`<div class="dcol" id="dc-${i}">
      <div class="${hdrCls}" id="dh-${i}">
        <div class="dh-top">
          <div class="dh-left">
            <div class="dname">${DAYS[i]}${isToday?' · TODAY':''}</div>
            <div class="ddate${isToday?' today-date':''}">${d.getDate()}</div>
            <div class="dinfo">${MONTHS[d.getMonth()]} ${d.getFullYear()}</div>
            ${total?`<div class="dinfo" style="color:var(--teal);font-weight:700">${total} patient${total>1?'s':''}</div>`:''}
          </div>
          <div class="dh-right">${hdrBtns}</div>
        </div>
      </div>
      <div class="dbody" id="db-${i}">`;

    // Slot index tracks position for time calculation across BOTH conf and active
    let slotIdx=0;

    // Confirmed slots — locked unless editMode
    conf.forEach((p,ci)=>{
      const z=zoneOf(p),nm=p.patient_name||'';
      const addr=(p.address||'').split(',')[0];
      const storedTime=p.appointment_date_time?.substring(11,16)||'';
      const dispTime=editMode?calcTime(i,slotIdx):storedTime;
      const canDrag=editMode;
      html+=`<div class="sc${editMode?' edit-sc':' conf-sc'}${canDrag?'':' locked-card'}"
          style="border-left-color:${z.c}"
          data-pid="${p.id}" data-day="${i}" data-bkt="conf" data-idx="${ci}">
          <span class="sc-name">${esc(nm)}</span>
          <div class="sc-row">
            <span class="sc-zone">${z.n}</span>
            <span class="sc-addr">${esc(addr)}</span>
            ${editMode?`<span class="sc-badge badge-lock">Edit</span>
              <button class="sc-x" data-rm="${i}|conf|${ci}">✕</button>`:
              '<span class="sc-badge badge-conf">✓</span>'}
          </div>
          <span class="sc-time">🕐 ${dispTime}</span>
          ${canDrag?'<span class="rh" title="Drag to reorder">⠿</span>':''}
        </div>`;
      slotIdx++;
    });

    // Active (suggested/pending) slots — always draggable
    active.forEach((p,ai)=>{
      const z=zoneOf(p),nm=p.patient_name||'';
      const addr=(p.address||'').split(',')[0];
      const isSugg=p._sugg;
      html+=`<div class="sc${isSugg?' sugg-sc':' pend-sc'}"
          style="border-left-color:${z.c}"
          data-pid="${p.id}" data-day="${i}" data-bkt="active" data-idx="${ai}">
          <span class="sc-name">${esc(nm)}</span>
          <div class="sc-row">
            <span class="sc-zone">${z.n}</span>
            <span class="sc-addr">${esc(addr)}</span>
            ${isSugg?'<span class="sc-badge badge-sugg">auto</span>':''}
            <button class="sc-x" data-rm="${i}|active|${ai}">✕</button>
          </div>
          <span class="sc-time">🕐 ${calcTime(i,slotIdx)}</span>
          <span class="rh" title="Drag to reorder">⠿</span>
        </div>`;
      slotIdx++;
    });

    if(!total)html+=`<div class="drop-hint">Drop here</div>`;
    html+=`</div></div>`; // close dbody + dcol
  }
  grid.innerHTML=html;

  // Event delegation: ✕ buttons
  grid.removeEventListener('click',onGridClick);
  grid.addEventListener('click',onGridClick);

  // Pointer drag: draggable scards
  grid.querySelectorAll('.sc[data-bkt="active"]').forEach(el=>ptDown(el,'scard'));
  grid.querySelectorAll('.sc.edit-sc').forEach(el=>ptDown(el,'scard'));

  updateConfAllBtn(totalUnconf);
  updateStatus();
}

function onGridClick(e){
  const x=e.target.closest('.sc-x');
  if(!x)return;
  e.stopPropagation();
  const[di,bkt,idx]=x.dataset.rm.split('|');
  removeSlot(+di,bkt,+idx);
}

// ════════════════════════════════════════════════════════════
// SLOT OPERATIONS
// ════════════════════════════════════════════════════════════
function removeSlot(dayIdx,bkt,idx){
  const arr=days[dayIdx][bkt];
  if(!arr||!arr[idx])return;
  const p=arr[idx];
  days[dayIdx][bkt]=arr.filter((_,i)=>i!==idx);
  // Return to pool if eligible
  const winD=windowDates();
  const wf=addDays(fromYMD(winD[0]),-WIN);
  const wt=addDays(fromYMD(winD[6]), WIN);
  const due=p.due_date?fromYMD(p.due_date):null;
  if(due&&due>=wf&&due<=wt)pool.push({...p,_sugg:false});
  sortPool();renderPool();renderGrid();
}

function toggleEdit(dayIdx){
  const d=days[dayIdx];
  if(d.editMode){
    d.editMode=false;
  } else {
    if(!confirm('Unlock confirmed appointments for editing?\nChanges only save when you click Confirm for this day.'))return;
    d.editMode=true;
  }
  renderGrid();
}

// ════════════════════════════════════════════════════════════
// POINTER-BASED DRAG (works on desktop + mobile)
// ════════════════════════════════════════════════════════════
let drag=null;

function ptDown(el,type){
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('.sc-x,.btn-sm,button'))return;
    e.preventDefault();
    const pid=el.dataset.pid;
    const fromDay=el.dataset.day!==undefined?+el.dataset.day:-1;
    const fromBkt=el.dataset.bkt;
    const fromIdx=el.dataset.idx!==undefined?+el.dataset.idx:-1;
    const nm=allPats.find(p=>String(p.id)===String(pid))?.patient_name||pid;
    const z=zoneOf(allPats.find(p=>String(p.id)===String(pid))||{});
    // Ghost
    const g=document.createElement('div');
    g.className='ghost';
    g.textContent=nm;
    g.style.background=z.c||'var(--teal)';
    document.body.appendChild(g);
    g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';
    el.classList.add('gsrc');
    drag={pid,fromPool:type==='pool',fromDay,fromBkt,fromIdx,ghost:g,el};
    document.addEventListener('pointermove',ptMove,{passive:false});
    document.addEventListener('pointerup',ptUp,{passive:false});
  },{passive:false});
}

function ptMove(e){
  if(!drag)return;
  e.preventDefault();
  drag.ghost.style.left=e.clientX+'px';
  drag.ghost.style.top=e.clientY+'px';
  clearDropFeedback();
  const t=document.elementFromPoint(e.clientX,e.clientY);
  if(!t)return;
  t.closest('.dbody')?.classList.add('over');
  t.closest('.sc[data-bkt="active"],.sc.edit-sc')?.classList.add('drop-above');
}

function ptUp(e){
  if(!drag)return;
  e.preventDefault();
  drag.ghost.remove();
  drag.el?.classList.remove('gsrc');
  clearDropFeedback();
  document.removeEventListener('pointermove',ptMove);
  document.removeEventListener('pointerup',ptUp);
  const under=document.elementFromPoint(e.clientX,e.clientY);
  if(!under){drag=null;return;}
  const db=under.closest('.dbody');
  const sc=under.closest('.sc[data-bkt="active"],.sc.edit-sc');
  const dayIdx=db?+db.id.replace('db-',''):-1;
  const toIdx=sc?+sc.dataset.idx:-1;
  const {pid,fromPool,fromDay,fromBkt,fromIdx}=drag;
  drag=null;
  if(dayIdx<0)return;
  if(fromPool)doAssign(pid,dayIdx,toIdx);
  else if(fromDay===dayIdx)reorder(dayIdx,fromBkt,fromIdx,toIdx);
  else moveBetween(fromDay,fromBkt,fromIdx,dayIdx,toIdx);
}

function clearDropFeedback(){
  document.querySelectorAll('.dbody.over').forEach(e=>e.classList.remove('over'));
  document.querySelectorAll('.sc.drop-above,.sc.drop-below')
    .forEach(e=>e.classList.remove('drop-above','drop-below'));
}

// ════════════════════════════════════════════════════════════
// ASSIGNMENT & MOVEMENT
// ════════════════════════════════════════════════════════════
function doAssign(pid,dayIdx,insertAt){
  if(isAssigned(pid)){toast('Already scheduled');return;}
  const p=allPats.find(pp=>String(pp.id)===String(pid))
        ||pool.find(pp=>String(pp.id)===String(pid));
  if(!p)return;
  pool=pool.filter(pp=>String(pp.id)!==String(pid));
  const pp={...p,_sugg:false};
  insert(days[dayIdx].active,insertAt,pp);
  renderPool();renderGrid();toast(`→ ${DAYS[dayIdx]}`);
}

function moveBetween(fd,fb,fi,td,ti){
  const arr=days[fd][fb];
  if(!arr||arr[fi]===undefined)return;
  const p={...arr[fi],_sugg:false};
  days[fd][fb]=arr.filter((_,i)=>i!==fi);
  insert(days[td].active,ti,p);
  renderPool();renderGrid();toast(`${DAYS[fd]} → ${DAYS[td]}`);
}

function reorder(di,bkt,fi,ti){
  if(ti<0||ti===fi)return;
  const arr=days[di][bkt];
  const[item]=arr.splice(fi,1);
  arr.splice(fi<ti?ti-1:ti,0,item);
  renderGrid();toast('Reordered — times recalculated');
}

function insert(arr,at,item){
  if(at>=0&&at<arr.length)arr.splice(at,0,item);
  else arr.push(item);
}

// ════════════════════════════════════════════════════════════
// CONFIRM SINGLE DAY  —  writes to DB, marks confirmed
// ════════════════════════════════════════════════════════════
async function confirmDay(dayIdx){
  const d=days[dayIdx];
  // When in editMode, ALL patients (conf + active) get re-written
  // When NOT in editMode, only active patients get confirmed
  const toSave = d.editMode
    ? [...d.conf,...d.active]
    : d.active;

  if(!toSave.length){toast('No unconfirmed patients on this day');return;}
  const ds=windowDates()[dayIdx];
  const dayName=`${DAYS[dayIdx]} ${ds}`;
  const btn=document.querySelector(`#dh-${dayIdx} .btn-conf-day`);
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  const startMin=getStartMin();
  // Offset: if not in editMode, confirmed slots keep their existing times
  // If in editMode, ALL slots get recalculated from position 0
  const confOffset=d.editMode?0:d.conf.length;
  let saved=0;
  try{
    // In editMode: first clear all existing conf patients' appointments for this day
    if(d.editMode){
      for(const p of d.conf){
        await _sb.from('patients').update({
          appointment_date_time:null,appointment_confirmed:false}).eq('id',p.id);
      }
    }
    // Save all toSave patients
    for(let j=0;j<toSave.length;j++){
      const p=toSave[j];
      const slotPos = d.editMode ? j : confOffset+j;
      const tm=startMin+slotPos*SLOT;
      const dt=`${ds}T${p2(Math.floor(tm/60))}:${p2(tm%60)}`;
      await _sb.from('patients').update({
        appointment_date_time:dt,appointment_confirmed:true}).eq('id',p.id);
      saved++;
    }
    // Signal index.html
    localStorage.setItem('vapiq_appts_updated',Date.now());
    toast(`✅ ${saved} confirmed for ${dayName}`,3000);
    // Reload this day from DB by triggering full reload
    await reload();
  }catch(e){
    toast('Error: '+e.message,4000);
    if(btn){btn.disabled=false;btn.textContent=`✓ Confirm (${d.active.length})`;}
  }
}

// ════════════════════════════════════════════════════════════
// CONFIRM ALL UNCONFIRMED  —  saves all remaining active patients
// ════════════════════════════════════════════════════════════
async function confirmAll(){
  const hasPending=days.some(d=>d.active.length>0);
  if(!hasPending){toast('All patients already confirmed');return;}
  const btn=document.getElementById('cab');
  btn.disabled=true;btn.textContent='Saving…';
  const winD=windowDates();
  const startMin=getStartMin();
  let saved=0;
  try{
    for(let i=0;i<7;i++){
      const d=days[i];
      if(!d.active.length)continue;
      const ds=winD[i];
      const confOff=d.conf.length;
      for(let j=0;j<d.active.length;j++){
        const p=d.active[j];
        const tm=startMin+(confOff+j)*SLOT;
        const dt=`${ds}T${p2(Math.floor(tm/60))}:${p2(tm%60)}`;
        await _sb.from('patients').update({
          appointment_date_time:dt,appointment_confirmed:true}).eq('id',p.id);
        saved++;
      }
    }
    localStorage.setItem('vapiq_appts_updated',Date.now());
    toast(`✅ ${saved} appointments confirmed!`,3500);
    await reload();
  }catch(e){toast('Error: '+e.message,4000);}
  updateConfAllBtn(0);
}

// ════════════════════════════════════════════════════════════
// UNDO OPERATIONS
// ════════════════════════════════════════════════════════════
async function undoDay(dayIdx){
  const d=days[dayIdx];
  const total=d.conf.length+d.active.length;
  if(!total){toast('Nothing on this day');return;}
  if(!confirm(`Cancel all ${total} patient(s) for ${DAYS[dayIdx]}?`))return;
  try{
    for(const p of d.conf){
      await _sb.from('patients').update({
        appointment_date_time:null,appointment_confirmed:false}).eq('id',p.id);
    }
    localStorage.setItem('vapiq_appts_updated',Date.now());
    toast(`↩ Cancelled ${total} for ${DAYS[dayIdx]}`);
    await reload();
  }catch(e){toast('Error: '+e.message,4000);}
}

async function undoWindow(){
  const total=days.reduce((s,d)=>s+d.conf.length+d.active.length,0);
  if(!total){toast('Nothing scheduled in this window');return;}
  if(!confirm(`Cancel ALL ${total} appointments in the current 7-day window?`))return;
  const btn=document.querySelector('.undo-wk-btn');
  btn.disabled=true;btn.textContent='Cancelling…';
  try{
    for(const d of days){
      for(const p of d.conf){
        await _sb.from('patients').update({
          appointment_date_time:null,appointment_confirmed:false}).eq('id',p.id);
      }
    }
    localStorage.setItem('vapiq_appts_updated',Date.now());
    toast(`↩ All ${total} appointments cleared`,3500);
    await reload();
  }catch(e){toast('Error: '+e.message,4000);}
  btn.disabled=false;btn.textContent='↩ Undo Window';
}

// ════════════════════════════════════════════════════════════
// SEARCH
// ════════════════════════════════════════════════════════════
let _st=null;
function onSearch(q){
  clearTimeout(_st);
  if(!q.trim()){searchMode=false;renderPool();return;}
  _st=setTimeout(()=>{
    const ql=q.toLowerCase();
    searchList=allPats.filter(p=>!isAssigned(p.id)&&(
      (p.patient_name||'').toLowerCase().includes(ql)||
      (p.file_number||'').toLowerCase().includes(ql)||
      (p.address||'').toLowerCase().includes(ql)));
    searchMode=true;renderPool();
  },220);
}
function addOutside(){
  const q=document.getElementById('sq').value.trim();
  if(!q){toast('Enter a name or file # first');return;}
  const ql=q.toLowerCase();
  const match=allPats.find(p=>!isAssigned(p.id)&&!pool.some(pp=>pp.id===p.id)&&(
    (p.patient_name||'').toLowerCase().includes(ql)||
    (p.file_number||'').toLowerCase()===ql));
  if(!match){toast('Not found or already placed');return;}
  pool.push({...match,_sugg:false});
  sortPool();searchMode=false;
  document.getElementById('sq').value='';
  renderPool();
  toast(`+ ${match.patient_name||'Patient'} added`);
}

// ════════════════════════════════════════════════════════════
// UI HELPERS
// ════════════════════════════════════════════════════════════
function updateConfAllBtn(n){
  const btn=document.getElementById('cab');
  btn.disabled=n===0;
  btn.textContent=n>0?`✓ Confirm All Unconfirmed (${n})`:'✓ Confirm All Unconfirmed';
}
function updateStatus(){
  const conf=days.reduce((s,d)=>s+d.conf.length,0);
  const sugg=days.reduce((s,d)=>s+d.active.filter(p=>p._sugg).length,0);
  const pend=days.reduce((s,d)=>s+d.active.filter(p=>!p._sugg).length,0);
  document.getElementById('stot').textContent=
    `${conf} confirmed · ${sugg} suggested · ${pend} pending · ${pool.length} in pool`;
}
function updateNavLabel(){
  const winD=windowDates();
  const s=fromYMD(winD[0]),e=fromYMD(winD[6]);
  document.getElementById('navlbl').textContent=
    `${s.getDate()} ${MFULL[s.getMonth()]} – ${e.getDate()} ${MFULL[e.getMonth()]} ${e.getFullYear()}`;
}
function nav(n){
  windowStart=toYMD(addDays(fromYMD(windowStart),n));
  reload();
}
function navToday(){windowStart=todayYMD();reload();}
function toggleSB(){
  sbOpen=!sbOpen;
  document.getElementById('sb').classList.toggle('off',!sbOpen);
  document.getElementById('ctab').textContent=sbOpen?'◀':'▶';
}
function toggleTheme(){
  const n=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',n);
  localStorage.setItem('vapiq_sched_theme',n);
}
function toast(msg,dur=2200){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('on');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),dur);
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
