<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                 font-src https://fonts.gstatic.com;
                 img-src 'self' data:;
                 connect-src 'self' https://*.supabase.co;
                 media-src 'self';">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dubbi">
  <meta name="theme-color" content="#F4F6F9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E141D" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <title>Dubbi</title>
<style>
/* ── Tokens ─────────────────────────────────────────────────────────── */
:root{
  --teal:#2D8C8A;--teal-2:#3AA8A5;--teal-ink:#1C6664;--teal-soft:#E4F3F2;
  --bg:#F4F6F9;--card:#FFFFFF;--card-2:#F8FAFC;--line:#E3E8EF;--ink:#16202E;--ink-2:#55627A;--ink-3:#8C96A8;
  --red:#D1453B;--red-soft:#FDECEA;--amber:#B7741A;--amber-soft:#FFF4DF;--green:#23855A;--green-soft:#E3F4EA;
  --violet:#6B4FD0;--violet-soft:#EFEAFD;--blue:#2E6FD6;--blue-soft:#E7F0FD;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
  --radius:18px;--tabbar:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --teal:#3DB3AF;--teal-2:#58C4C0;--teal-ink:#8FE0DC;--teal-soft:#13302F;
    --bg:#0E141D;--card:#17202D;--card-2:#1C2735;--line:#273447;--ink:#E7ECF3;--ink-2:#9AA8BC;--ink-3:#66748A;
    --red:#F07167;--red-soft:#3A1D1D;--amber:#F2B957;--amber-soft:#3A2E16;--green:#5CCB93;--green-soft:#15302A;
    --violet:#A88BFA;--violet-soft:#2A2345;--blue:#7AA7F5;--blue-soft:#1B2A45;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --teal:#3DB3AF;--teal-2:#58C4C0;--teal-ink:#8FE0DC;--teal-soft:#13302F;
  --bg:#0E141D;--card:#17202D;--card-2:#1C2735;--line:#273447;--ink:#E7ECF3;--ink-2:#9AA8BC;--ink-3:#66748A;
  --red:#F07167;--red-soft:#3A1D1D;--amber:#F2B957;--amber-soft:#3A2E16;--green:#5CCB93;--green-soft:#15302A;
  --violet:#A88BFA;--violet-soft:#2A2345;--blue:#7AA7F5;--blue-soft:#1B2A45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}

/* ── Base: phone-first, never wider than the screen ─────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding:0 env(safe-area-inset-right) calc(var(--tabbar) + env(safe-area-inset-bottom) + 12px) env(safe-area-inset-left)}
/* iPhone zooms into any field under 16px — keep every field at 16px */
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{font-size:16px;max-width:100%;min-width:0}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--teal)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

/* ── Header ─────────────────────────────────────────────────────────── */
header.top{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 0 9px}
.avatar{width:40px;height:40px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;
  background:linear-gradient(140deg,var(--teal-2),var(--teal) 55%,var(--teal-ink));box-shadow:0 4px 14px color-mix(in srgb,var(--teal) 35%,transparent)}
.htxt{flex:1;min-width:0}
.htxt h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htxt .sub{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:18px;height:18px}
.health{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.health.bad .dot{background:var(--red);box-shadow:0 0 0 3px var(--red-soft);animation:pulse 1.6s infinite}
.health.bad{color:var(--red)}
@keyframes pulse{50%{opacity:.35}}

/* ── Summary tiles ──────────────────────────────────────────────────── */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0 4px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 9px;text-align:left;min-width:0;box-shadow:var(--shadow);
  transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tile span{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.hot{background:linear-gradient(160deg,var(--red-soft),var(--card));border-color:color-mix(in srgb,var(--red) 30%,var(--line))}
.tile.hot b{color:var(--red)}
.tile.ok b{color:var(--teal)}
@media (max-width:340px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.tile{padding:9px 8px 8px}.tile b{font-size:22px}.tile span{font-size:11px}}

/* ── Sections & cards ───────────────────────────────────────────────── */
.sec{display:flex;align-items:center;gap:8px;margin:20px 2px 8px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.sec .count{font-size:12px;background:var(--line);color:var(--ink-2);border-radius:999px;padding:1px 8px;letter-spacing:0}
.sec.red{color:var(--red)} .sec.red .count{background:var(--red-soft);color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);
  animation:rise .35s cubic-bezier(.2,.8,.2,1) both;min-width:0;overflow-wrap:anywhere}
.card.overdue{border-color:color-mix(in srgb,var(--red) 45%,var(--line));box-shadow:0 0 0 3px var(--red-soft),var(--shadow)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card,.tile{animation:none!important;transition:none!important}}
.ctop{display:flex;align-items:flex-start;gap:10px}
.cicon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:17px}
.ic-new{background:var(--blue-soft)} .ic-reply{background:var(--teal-soft)} .ic-close{background:var(--amber-soft)}
.ic-rx{background:var(--violet-soft)} .ic-wait{background:var(--card-2)} .ic-dup{background:var(--card-2)}
.ctitle{flex:1;min-width:0}
.ctitle .kind{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.ctitle b{display:block;font-size:16.5px;font-weight:700;line-height:1.25;margin-top:1px}
.meta{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;flex:none;max-width:42%}
.chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--card-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.test{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.chip.late{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.ok{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.note{font-size:13.5px;color:var(--ink-2);margin:10px 0 0}
.warn{background:var(--amber-soft);color:var(--amber);font-size:13px;font-weight:500;border-radius:12px;padding:9px 11px;margin-top:10px}
.warn div+div{margin-top:4px}
.err{background:var(--red-soft);color:var(--red)}

/* documents checklist */
.docs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.doc{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card-2)}
.doc.have{background:var(--green-soft);color:var(--green);border-color:transparent}
.doc.miss{background:var(--red-soft);color:var(--red);border-color:transparent}
.scan{margin-top:8px;border:1px dashed var(--line);border-radius:12px;padding:9px 10px;font-size:13px}
.scan .t{font-weight:600;margin-bottom:6px}
.toggle{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--ink-2);margin:2px 4px 2px 0}
.toggle.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-ink)}

/* facts */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.facts div{background:var(--card-2);border-radius:12px;padding:8px 10px;min-width:0}
.facts span{display:block;font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.facts b{font-size:15px}.facts b.chg{color:var(--red)}

/* form */
details.form{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.form summary{font-size:13.5px;font-weight:700;color:var(--teal);list-style:none;cursor:pointer;padding:4px 0}
details.form summary::-webkit-details-marker{display:none}
details.form summary::after{content:' ›';display:inline-block;transition:transform .2s}
details.form[open] summary::after{transform:rotate(90deg)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;margin-top:8px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.fld input,.fld select{width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:12px;background:var(--card-2);-webkit-appearance:none;appearance:none}
.fld input[type=date]{min-height:44px}
.fld.miss input,.fld.miss select{border-color:var(--red);background:var(--red-soft)}
.fld.miss label{color:var(--red)}
@media (max-width:420px){.grid{grid-template-columns:minmax(0,1fr)}}

/* reply editor */
.mailhead{font-size:13px;color:var(--ink-2);margin-top:10px;background:var(--card-2);border-radius:12px;padding:8px 10px}
.mailhead div{display:flex;gap:8px;min-width:0}.mailhead div+div{margin-top:3px}
.mailhead span{flex:none;width:52px;font-weight:700;color:var(--ink-3)}
.mailhead em{font-style:normal;min-width:0;overflow-wrap:anywhere}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.lang button{border:0;background:none;padding:5px 12px;font-size:12.5px;font-weight:800;color:var(--ink-3)}
.lang button.on{background:var(--teal);color:#fff}
textarea.reply{display:block;width:100%;margin-top:8px;padding:11px 12px;line-height:1.5;border:1.5px solid var(--line);border-radius:14px;background:var(--card-2);resize:vertical;min-height:170px}
textarea.reply:focus,.fld input:focus,.fld select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
pre.sent{white-space:pre-wrap;font:inherit;font-size:14px;background:var(--card-2);border-radius:12px;padding:10px 12px;margin:10px 0 0}

/* actions */
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1 1 30%;min-width:0;min-height:46px;border-radius:14px;border:0;font-weight:800;font-size:14.5px;padding:10px 12px;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,var(--teal-2),var(--teal));color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--teal) 30%,transparent)}
.btn.sec2{background:var(--card-2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--ink-2);border:1px solid var(--line)}
.btn.warnb{background:var(--amber-soft);color:var(--amber)}
.btn:disabled{opacity:.5;pointer-events:none}

/* journey */
.journey{display:flex;align-items:flex-start;margin-top:12px}
.step{flex:1;min-width:0;text-align:center;position:relative;font-size:10px;font-weight:700;color:var(--ink-3);line-height:1.2;overflow-wrap:normal;word-break:keep-all;letter-spacing:-.01em}
.step i{display:grid;place-items:center;width:24px;height:24px;margin:0 auto 5px;border-radius:50%;background:var(--card-2);border:2px solid var(--line);font-style:normal;font-size:12px;position:relative;z-index:1}
.step::before{content:'';position:absolute;top:11px;right:50%;width:100%;height:2px;background:var(--line)}
.step:first-child::before{display:none}
.step.done i{background:var(--teal);border-color:var(--teal);color:#fff}
.step.done::before{background:var(--teal)}
.step.late i{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.step.late{color:var(--red)}
.step.done{color:var(--ink-2)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t b{font-size:14.5px}

/* tab bar */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);
  border-top:1px solid var(--line)}
nav.tabbar .in{display:flex;width:100%;max-width:520px}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--ink-3);position:relative}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--teal)}
.tab .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;font-weight:800}
.empty{text-align:center;padding:48px 16px;color:var(--ink-3)}
.empty .big{font-size:42px;margin-bottom:8px}
.banner{font-size:13px;font-weight:600;background:var(--violet-soft);color:var(--violet);border-radius:12px;padding:9px 12px;margin-top:12px}

/* sign-in */
#login{max-width:400px;margin:12vh auto 0;padding:0 16px}
#login .card{padding:24px}
#login h2{margin:14px 0 4px;font-size:22px}
#login p{margin:0 0 16px;color:var(--ink-2);font-size:14px}
#login .fld{margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;transition:.25s;max-width:calc(100% - 32px);z-index:40;box-shadow:var(--shadow)}
.toast.on{transform:translate(-50%,0);opacity:1}
.skel{height:92px;border-radius:var(--radius);margin-bottom:10px;background:linear-gradient(90deg,var(--card) 25%,var(--card-2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
/* ── Dubbi voice ────────────────────────────────────────────────────── */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(var(--tabbar) + 18px + env(safe-area-inset-bottom));z-index:25;
  width:60px;height:60px;border-radius:50%;border:0;color:#fff;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,var(--teal-2),var(--teal) 60%,var(--teal-ink));box-shadow:0 10px 28px color-mix(in srgb,var(--teal) 45%,transparent)}
.fab svg{width:26px;height:26px}.fab:active{transform:scale(.94)}
@keyframes ring{0%{opacity:.8;transform:scale(.92)}100%{opacity:0;transform:scale(1.25)}}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,16,24,.38);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:640px;margin:0 auto;height:min(86vh,760px);display:flex;flex-direction:column;
  background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px}
.shead{display:flex;align-items:center;gap:10px;padding:6px 16px 10px;border-bottom:1px solid var(--line)}
.shead b{flex:1;font-size:17px}
.chat{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg{max-width:86%;padding:10px 13px;border-radius:18px;font-size:15.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .25s both}
.msg.me{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.sys{align-self:center;background:none;color:var(--ink-3);font-size:13px;padding:2px}
.prop{align-self:stretch;background:var(--card);border:1.5px solid var(--teal);border-radius:16px;padding:12px;animation:rise .25s both}
.prop p{margin:0 0 10px;font-size:14.5px}
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 3px var(--teal-2)}100%{box-shadow:0 0 0 0 transparent}}
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.suggest button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-size:14px;font-weight:600;color:var(--ink-2)}
.sbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card)}
.sbar input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:11px 14px;background:var(--card-2)}
.sbar input:focus{outline:none;border-color:var(--teal)}
.mic{width:48px;height:48px;border-radius:50%;border:0;flex:none;display:grid;place-items:center;color:#fff;background:var(--teal)}
.mic svg{width:22px;height:22px}
.mic.live{background:var(--red);animation:breathe 1.2s infinite}
@keyframes breathe{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--red) 25%,transparent)}}
.interim{min-height:20px;padding:0 18px 6px;font-size:14px;color:var(--ink-3);font-style:italic}
.settings{padding:14px 16px;overflow-y:auto;flex:1}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.setrow small{display:block;color:var(--ink-3);font-size:12.5px}
.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw:checked{background:var(--teal)}.sw:checked::after{left:23px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 11px;font-size:13px;font-weight:800;color:var(--ink-3)}
.seg button.on{background:var(--teal);color:#fff}
.keybox{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--card-2);border:1px dashed var(--teal);border-radius:12px;padding:10px;word-break:break-all;margin:8px 0}
ol.steps{padding-left:20px;margin:8px 0;font-size:14px;line-height:1.5}

</style>
</head>
<body>

<section id="login" hidden>
  <div class="card">
    <div class="avatar">D</div>
    <h2>Hi, I'm Dubbi</h2>
    <p>Your VaPiq assistant. Sign in with your VaPiq account.</p>
    <form id="loginForm">
      <div class="fld"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required></div>
      <div class="fld"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
      <button class="btn pri" style="width:100%" type="submit">Sign in</button>
    </form>
  </div>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="wrap">
      <div class="hrow">
        <div class="avatar" aria-hidden="true">D</div>
        <div class="htxt">
          <h1 id="greet">Dubbi</h1>
          <div class="sub"><span class="health" id="health"><span class="dot"></span><span id="healthTxt">…</span></span></div>
        </div>
        <button class="iconbtn" id="pushBtn" type="button" aria-label="Turn on notifications" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        </button>
        <button class="iconbtn" id="refreshBtn" type="button" aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <a class="iconbtn" href="../" aria-label="Open VaPiq">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </a>
      </div>
    </div>
  </header>
  <main class="wrap" id="main"><div class="skel" style="margin-top:16px"></div><div class="skel"></div><div class="skel"></div></main>
  <nav class="tabbar" aria-label="Sections"><div class="in">
    <button class="tab on" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Today<span class="badge" id="b-today" hidden></span></button>
    <button class="tab" data-tab="patients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Patients<span class="badge" id="b-patients" hidden></span></button>
    <button class="tab" data-tab="outbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>Outbox<span class="badge" id="b-outbox" hidden></span></button>
    <button class="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
  </div></nav>
</div>

<!-- Dubbi voice assistant -->
<button class="fab" id="fab" type="button" aria-label="Ask Dubbi" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
</button>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-label="Dubbi" aria-modal="true">
  <div class="grab"></div>
  <div class="shead">
    <div class="avatar" style="width:34px;height:34px;font-size:16px;border-radius:12px">D</div>
    <b id="sheetTitle">Dubbi</b>
    <button class="iconbtn" id="setBtn" type="button" aria-label="Voice settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <button class="iconbtn" id="closeSheet" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="chat" id="chat"></div>
  <div class="settings" id="settings" hidden></div>
  <div class="interim" id="interim"></div>
  <form class="sbar" id="askForm">
    <input id="askInput" type="text" enterkeyhint="send" autocomplete="off" placeholder="Ask Dubbi…" aria-label="Message to Dubbi">
    <button class="mic" id="micBtn" type="button" aria-label="Speak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg></button>
  </form>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="push-config.js"></script>
<script src="../js/reply-templates.js"></script>
<script>
'use strict';
// Same project, key and browser session as VaPiq (index.html).
const SUPABASE_URL = 'https://wqlbmtjbjloxpvsbeqyb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_gcyK2z_8lvbOgHNcJfdX1g_8QCWJ_Xi';
const DOSES = ['7.5', '22.5', '30', '45'];
const INACTIVITY_LIMIT_MS = 30 * 60 * 1000;                     // same as VaPiq
const LATE = { newPatient: 24, reply: 48, docs: 24, asked: 48 }; // hours — same as assistant/config alerts
const HEARTBEAT_ID = '00000000-0000-0000-0000-00000000beef';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const normFile = v => String(v ?? '').trim().toLowerCase();
const hoursSince = iso => iso ? (Date.now() - Date.parse(iso)) / 36e5 : 0;
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
let S = { rows: [], tasks: [], beat: null, sched: [], unconf: [], pts: {} }, tab = 'today', user = null;

function toast(msg, ms = 2800) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}
function ago(iso) {
  if (!iso) return '';
  const m = Math.round((Date.now() - Date.parse(iso)) / 6e4);
  if (m < 1) return 'just now'; if (m < 60) return `${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `${h} h`;
  const d = Math.round(h / 24); return d === 1 ? '1 day' : `${d} days`;
}
function when(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('en-CA', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
const dayLabel = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' }) : '—';

// ── Auth ────────────────────────────────────────────────────────────────
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  user = session?.user || null;
  $('login').hidden = !!user; $('app').hidden = !user;
  if (user) { await load(); setupPush(); resetInactivity(); $('fab').hidden = false; }
  else $('fab').hidden = true;
}
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  $('pw').value = '';
  if (error) { toast('Sign-in failed — check email and password'); return; }
  start();
});
let _idle;
function resetInactivity() {
  clearTimeout(_idle);
  _idle = setTimeout(async () => { await sb.auth.signOut({ scope: 'local' }); toast('Signed out after 30 minutes of inactivity'); start(); }, INACTIVITY_LIMIT_MS);
}
['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => user && resetInactivity(), { passive: true }));

// ── Data ────────────────────────────────────────────────────────────────
async function load() {
  const since = new Date(Date.now() - 30 * 864e5).toISOString();
  const horizon = ymd(new Date(Date.now() + 14 * 864e5)), today = ymd(new Date());
  const [p, t, h, sc, uc] = await Promise.all([
    sb.from('pending_patients').select('*').gte('created_at', since).order('created_at', { ascending: false }),
    sb.from('email_tasks').select('*').gte('created_at', since).order('created_at', { ascending: false }),
    sb.from('assistant_log').select('created_at,summary').eq('id', HEARTBEAT_ID).maybeSingle(),
    sb.from('patients').select('id,file_number,patient_name,due_date,phone1').eq('archived', false).is('appointment_date_time', null).lte('due_date', horizon).order('due_date'),
    sb.from('patients').select('id,file_number,patient_name,appointment_date_time,phone1').eq('archived', false).eq('appointment_confirmed', false)
      .gte('appointment_date_time', today).lte('appointment_date_time', horizon + 'T23:59').order('appointment_date_time'),
  ]);
  const err = p.error || t.error;
  if (err) { $('main').innerHTML = `<div class="warn err" style="margin-top:16px">Could not load: ${esc(err.message)}. Have all the database setup files in supabase/ been run?</div>`; return; }
  S.rows = p.data; S.tasks = t.data; S.beat = h.data || null; S.sched = sc.data || []; S.unconf = uc.data || [];
  // Patients added from Dubbi → their appointment status for the journey tracker
  const ids = [...new Set(S.rows.filter(r => r.patient_id && !r.is_test).map(r => r.patient_id))];
  S.pts = {};
  if (ids.length) {
    const { data } = await sb.from('patients').select('id,appointment_date_time,appointment_confirmed,archived').in('id', ids);
    (data || []).forEach(x => { S.pts[String(x.id)] = x; });
  }
  render();
}

async function audit(action, fileNum, detail) {
  const { error } = await sb.from('audit_log').insert({
    user_email: user.email, action, patient_file_num: String(fileNum || ''),
    detail: detail ? JSON.stringify(detail).slice(0, 500) : null, created_at: new Date().toISOString(),
  });
  if (error) console.warn('[audit]', error.message);
}
async function allPatients() {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from('patients').select('id,file_number,patient_name,archived,pending').range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) return out;
  }
}

// ── Model: what needs you, and how urgently ─────────────────────────────
const pendingOf = t => t && t.pending_id ? S.rows.find(r => r.id === t.pending_id) : null;
const docsMissing = t => t.kind === 'new_patient' && missingDocs(t.documents || {}).length > 0;
const unknownDocs = t => ((t.documents && t.documents.files) || []).filter(f => !(f.types || []).length && !f.checked);
function lateness(item) {
  const { t, r } = item;
  if (r && (!t || t.status === 'todo') && r.status === 'pending' && hoursSince(r.created_at) > LATE.newPatient) return 'Not added · ' + ago(r.created_at);
  if (!t) return '';
  if (t.status === 'failed') return 'Send failed';
  if (t.status === 'reply_ready' && hoursSince(t.decided_at || t.created_at) > LATE.reply) return 'Waiting ' + ago(t.decided_at || t.created_at);
  if (t.status === 'todo' && t.kind !== 'new_patient' && hoursSince(t.created_at) > LATE.newPatient) return 'Waiting ' + ago(t.created_at);
  if (t.status === 'todo' && docsMissing(t) && !t.asked_docs_at && hoursSince(t.created_at) > LATE.docs) return 'Docs missing · ' + ago(t.created_at);
  if (t.status === 'waiting_docs' && hoursSince(t.asked_docs_at) > LATE.asked) return 'Asked ' + ago(t.asked_docs_at) + ' ago';
  return '';
}
// One item per thing to do. A new-patient item = its email task + its pre-filled card.
function todoItems() {
  const items = [], used = new Set();
  for (const t of S.tasks) {
    if (!['todo', 'reply_ready', 'failed', 'waiting_docs'].includes(t.status)) continue;
    const r = pendingOf(t); if (r) used.add(r.id);
    if (t.kind === 'new_patient' && t.status === 'todo' && r && ['rejected', 'dismissed', 'exists'].includes(r.status)) continue;
    let view;
    if (t.status === 'reply_ready' || t.status === 'failed') view = 'reply';
    else if (t.status === 'waiting_docs') view = 'waiting';
    else if (t.kind === 'new_patient') view = (r && r.status === 'approved') ? 'docs-done' : 'new';
    else view = t.kind === 'close_file' ? 'close' : 'rx';
    items.push({ t, r, view });
  }
  for (const r of S.rows) {
    if (used.has(r.id)) continue;
    if (r.status === 'pending') items.push({ t: null, r, view: 'new' });
    else if (r.status === 'exists') items.push({ t: null, r, view: 'dup' });
  }
  items.forEach(i => { i.late = lateness(i); });
  return items;
}
const ORDER = { new: 1, 'docs-done': 2, reply: 2, close: 3, rx: 4, waiting: 5, dup: 6 };
const SECTION = { new: 'New patients', 'docs-done': 'Replies to send', reply: 'Replies to send', close: 'Files to close', rx: 'Prescriptions to apply', waiting: 'Waiting for documents', dup: 'Duplicates' };

// ── Render ──────────────────────────────────────────────────────────────
function render() {
  const items = todoItems();
  const outbox = S.tasks.filter(t => ['send_approved', 'sending'].includes(t.status));
  const late = items.filter(i => i.late), active = items.filter(i => i.view !== 'waiting' && i.view !== 'dup');
  const today = ymd(new Date());
  const hr = new Date().getHours();
  $('greet').textContent = hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
  const bt = S.beat && S.beat.created_at, stale = !bt || hoursSince(bt) > 0.25;
  $('health').classList.toggle('bad', stale);
  $('healthTxt').textContent = !bt ? 'Mac hasn’t checked in yet'
    : stale ? `Mac offline · last check ${ago(bt)} ago`
    : `Mac checked ${ago(bt)}${ago(bt) === 'just now' ? '' : ' ago'}${S.beat.summary?.mode === 'test' ? ' · test' : ''}`;
  $('health').title = stale ? 'Your Mac assistant reads new emails every 2 minutes. Is your Mac on and awake?' : '';
  const setBadge = (id, n) => { const b = $(id); b.hidden = !n; b.textContent = n; };
  setBadge('b-today', active.length);
  setBadge('b-patients', S.sched.filter(p => p.due_date < today).length);
  setBadge('b-outbox', outbox.length);
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));

  const anyTest = S.rows.some(r => r.is_test) || S.tasks.some(t => t.is_test);
  const banner = anyTest && tab !== 'patients' ? '<div class="banner">🧪 TEST cards use fake data — VaPiq is never changed and replies are never really sent.</div>' : '';
  let html = '';
  if (tab === 'today') {
    const waiting = items.filter(i => i.view === 'waiting').length;
    html += `<div class="tiles">
      ${tile(late.length, 'Overdue', late.length ? 'hot' : 'ok', 'overdue')}
      ${tile(active.length, 'To do', '', 'todo')}
      ${tile(waiting, 'Waiting docs', '', 'waiting')}
      ${tile(S.sched.length, 'To schedule', S.sched.some(p => p.due_date < today) ? 'hot' : '', 'sched')}
    </div>` + banner;
    if (!items.length) html += `<div class="empty"><div class="big">✨</div><b>All clear.</b><br>Nothing needs you right now.</div>`;
    else {
      const byAge = (a, b) => String((a.t || a.r).created_at).localeCompare(String((b.t || b.r).created_at));
      if (late.length) html += section('Overdue', late.length, 'red', 'overdue') + late.slice().sort(byAge).map(card).join('');
      const groups = {};
      items.filter(i => !i.late).sort((a, b) => (ORDER[a.view] - ORDER[b.view]) || byAge(a, b))
        .forEach(i => { (groups[SECTION[i.view]] = groups[SECTION[i.view]] || []).push(i); });
      for (const [name, list] of Object.entries(groups)) html += section(name, list.length, '', list[0].view === 'waiting' ? 'waiting' : '') + list.map(card).join('');
    }
  } else if (tab === 'patients') html += patientsView();
  else if (tab === 'outbox') html += banner + (outbox.length ? section('Sending soon', outbox.length) + outbox.map(outboxCard).join('') : `<div class="empty"><div class="big">📭</div>No replies waiting to go out.</div>`);
  else html += banner + historyView();
  $('main').innerHTML = html;
}
const tile = (n, label, cls, jump) => `<button class="tile ${cls}" data-jump="${jump}"><b>${n}</b><span>${label}</span></button>`;
const section = (name, n, cls = '', id = '') => `<div class="sec ${cls}"${id ? ` id="sec-${id}"` : ''}>${esc(name)}<span class="count">${n}</span></div>`;

function from(t) {
  const n = (t?.related_emails || []).length;
  const name = (t?.email_from || '').replace(/<.*>/, '').trim() || t?.to_address || '';
  return `${esc(name)}${n > 1 ? ` · ${n} emails` : ''}`;
}
const fileRef = (fn, ref) => `#${esc(String(fn || '—').trim())}${ref && !/^\d+$/.test(ref) ? ` (${esc(ref.replace(/\s*\d{4,6}$/, ''))})` : ''}`;
function chips(item) {
  const x = item.t || item.r;
  return `<div class="chips">${x?.is_test ? '<span class="chip test">TEST</span>' : ''}${item.late ? `<span class="chip late">${esc(item.late)}</span>` : `<span class="chip">${ago(x?.created_at)}</span>`}</div>`;
}
function card(item) {
  switch (item.view) {
    case 'new': return newCard(item);
    case 'reply': return replyCard(item);
    case 'docs-done': return docsDoneCard(item);
    case 'waiting': return waitingCard(item);
    case 'close': return closeCard(item);
    case 'rx': return rxCard(item);
    default: return dupCard(item);
  }
}
const cardOpen = (item, icon, cls) => `<article class="card${item.late ? ' overdue' : ''}" data-t="${esc(item.t?.id || '')}" data-r="${esc(item.r?.id || '')}">
  <div class="ctop"><div class="cicon ${cls}" aria-hidden="true">${icon}</div>`;
const warnBox = list => list && list.length ? `<div class="warn">${list.map(w => `<div>⚠️ ${esc(w)}</div>`).join('')}</div>` : '';

function field(r, key, label, opts = {}) {
  const v = r.record[key] ?? '';
  const miss = (r.missing_fields || []).includes(label) || (opts.required && !String(v).trim());
  const id = `${key}-${r.id}`;
  const input = opts.select
    ? `<select id="${id}" data-k="${key}"><option value="">Choose…</option>${opts.select.map(o => `<option${o === v ? ' selected' : ''}>${o}</option>`).join('')}</select>`
    : `<input id="${id}" data-k="${key}" type="${opts.type || 'text'}" value="${esc(v)}" autocomplete="off"${opts.type === 'tel' ? ' inputmode="tel"' : ''}>`;
  return `<div class="fld${opts.wide ? ' wide' : ''}${miss ? ' miss' : ''}"><label for="${id}">${esc(label)}${miss ? ' · check' : ''}</label>${input}</div>`;
}
function docsBlock(t) {
  if (!t || !t.documents) return '';
  const d = t.documents, names = { assignment: 'Assignment form', enrollment: 'Enrollment form' };
  let h = `<div class="docs">${['assignment', 'enrollment'].map(k => `<span class="doc ${d[k] ? 'have' : 'miss'}">${d[k] ? '✓' : '✕'} ${names[k]}</span>`).join('')}</div>`;
  (d.files || []).forEach((f, i) => {
    const auto = (f.types || []).length && !f.checked;   // recognised automatically → nothing to ask
    if (auto) return;
    const on = k => (f.types || []).includes(k) ? ' on' : '';
    h += `<div class="scan"><div class="t">📠 ${esc(f.name)}${f.checked ? '' : ' — I couldn’t read this scan. What does it contain?'}</div>
      <button class="toggle${on('assignment')}" data-act="doc" data-i="${i}" data-k="assignment">Assignment form</button>
      <button class="toggle${on('enrollment')}" data-act="doc" data-i="${i}" data-k="enrollment">Enrollment form</button>

// ── Patients: journey tracker + scheduling safety net ───────────────────
function journey(t) {
  const r = pendingOf(t), p = r && r.patient_id ? S.pts[String(r.patient_id)] : null;
  const docsOk = !docsMissing(t), added = r && r.status === 'approved', replied = t.status === 'sent';
  const booked = !!(p && p.appointment_date_time), confirmed = !!(p && p.appointment_confirmed);
  const steps = [
    { n: 'Email', done: true },
    { n: 'Docs', done: docsOk, late: !docsOk && hoursSince(t.created_at) > LATE.docs },
    { n: 'Added', done: added, late: !added && hoursSince(t.created_at) > LATE.newPatient },
    { n: 'Replied', done: replied, late: !replied && added && hoursSince(r.decided_at) > LATE.reply },
    { n: 'Booked', done: booked, late: !booked && added && !r.is_test && hoursSince(r.decided_at) > 72 },
    { n: 'Confirmed', done: confirmed },
  ];
  return `<div class="journey">${steps.map(s => `<div class="step${s.done ? ' done' : s.late ? ' late' : ''}"><i>${s.done ? '✓' : s.late ? '!' : ''}</i>${s.n}</div>`).join('')}</div>`;
}
function patientsView() {
  const today = ymd(new Date());
  const newOnes = S.tasks.filter(t => t.kind === 'new_patient' && t.status !== 'dismissed');
  let h = section('New patients — last 30 days', newOnes.length);
  h += newOnes.length ? newOnes.map(t => {
    const r = pendingOf(t);
    return `<article class="card"><div class="ctop"><div class="ctitle"><b>${esc(r?.record?.patient_name || 'File ' + (t.file_number || '—'))}</b><div class="meta">File ${fileRef(t.file_number, t.subject_ref)} · email ${when(t.created_at)}</div></div>${t.is_test ? '<div class="chips"><span class="chip test">TEST</span></div>' : ''}</div>${journey(t)}</article>`;
  }).join('') : '<div class="card"><p class="note" style="margin:0">No new patients in the last 30 days.</p></div>';
  const past = S.sched.filter(p => p.due_date < today);
  h += section('Need an appointment · due within 14 days', S.sched.length, past.length ? 'red' : '');
  h += `<div class="card">${S.sched.length ? S.sched.map(p => `<div class="row"><div class="t"><b>${esc(p.patient_name)}</b><div class="meta">#${esc(String(p.file_number).trim())}${p.phone1 ? ' · ' + esc(p.phone1) : ''}</div></div><span class="chip ${p.due_date < today ? 'late' : ''}">Due ${dayLabel(p.due_date)}</span></div>`).join('') : '<p class="note" style="margin:0">✓ Everyone due in the next 14 days has an appointment.</p>'}</div>`;
  h += section('Appointments to confirm', S.unconf.length);
  h += `<div class="card">${S.unconf.length ? S.unconf.map(p => `<div class="row"><div class="t"><b>${esc(p.patient_name)}</b><div class="meta">#${esc(String(p.file_number).trim())}${p.phone1 ? ' · ' + esc(p.phone1) : ''}</div></div><span class="chip">${dayLabel(String(p.appointment_date_time).slice(0, 10))}</span></div>`).join('') : '<p class="note" style="margin:0">✓ All upcoming appointments are confirmed.</p>'}</div>`;
  return h;
}
function historyView() {
  const items = [];
  const pill = { approved: '<span class="chip ok">Added</span>', rejected: '<span class="chip late">Rejected</span>', dismissed: '<span class="chip">Dismissed</span>', sent: '<span class="chip ok">Replied</span>', done: '<span class="chip">No reply</span>' };

async function decide(r, status, extra = {}) {
  const { error } = await sb.from('pending_patients').update({ status, decided_at: new Date().toISOString(), decided_by: user.email, ...extra })
    .eq('id', r.id).in('status', ['pending', 'exists']);
  if (error) throw error;
}
// Moves a task forward only from the status it is in now (no double actions)
async function setTask(t, status, extra = {}) {
  const { error } = await sb.from('email_tasks').update({ status, decided_at: new Date().toISOString(), decided_by: user.email, ...extra })
    .eq('id', t.id).eq('status', t.status);
  if (error) throw error;
}
const sig = t => (t.details && t.details.signature) || '';
function redraft(t, over = {}) {
  const x = { ...t, ...over };
  return draftReply({ kind: x.kind, lang: x.lang, coordinatorName: x.to_name || '', fileNumber: x.file_number, subjectRef: x.subject_ref,
    signature: sig(x), docs: x.kind === 'new_patient' ? (x.documents || {}) : undefined });
}

async function approve(item, card, btn) {
  const { r, t } = item;
  const rec = { ...r.record };
  card.querySelectorAll('[data-k]').forEach(el => { if (el.dataset.k in rec) rec[el.dataset.k] = el.value.trim(); });
  rec.file_number = String(rec.file_number || '').trim();
  if (!rec.patient_name) return openDetails(card, 'Patient name is required');
  if (!rec.file_number) return openDetails(card, 'File number is required');
  if (!DOSES.includes(rec.dose_prescribed)) return openDetails(card, 'Choose the dose — check the PDF');
  if (!rec.due_date) return openDetails(card, 'Due date is required');
  btn.disabled = true;
  try {
    // VaPiq's rule, checked right before writing: an existing file number is never duplicated
    const existing = (await allPatients()).find(p => normFile(p.file_number) === normFile(rec.file_number));
    if (existing) {
      const ep = { file_number: existing.file_number, patient_name: existing.patient_name, status: existing.archived ? 'Archived' : existing.pending ? 'Pending' : 'Active' };
      await sb.from('pending_patients').update({ status: 'exists', existing_patient: ep }).eq('id', r.id);
      toast(`#${rec.file_number} already exists — not added`);
      return load();
    }
    if (r.is_test) {
      await decide(r, 'approved');
      await audit('ASSISTANT_TEST_APPROVED', rec.file_number, { pending_id: r.id });
    } else {
      const { data, error } = await sb.from('patients').insert([rec]).select('id').single();
      if (error) throw error;
      await audit('INSERT', rec.file_number, { name: rec.patient_name, source: 'assistant', pending_id: r.id });
      await decide(r, 'approved', { patient_id: String(data.id), record: rec });
    }
    if (t && t.status === 'todo') {
      const ask = docsMissing(t);
      await setTask(t, 'reply_ready', { reply_body: redraft(t), details: { ...(t.details || {}), reply_mode: ask ? 'ask_docs' : 'confirm' } });
    }
    toast(r.is_test ? 'Test card added — VaPiq not changed. Reply is ready.' : `✓ ${rec.patient_name} added to VaPiq — reply is ready`);
    load();
  } catch (e) {
    console.error('[approve]', e);
    toast('Could not save — ' + (e.message || 'please try again'));
  } finally { btn.disabled = false; }
}
function openDetails(card, msg) { const d = card.querySelector('details.form'); if (d) d.open = true; toast(msg); }

// Close file = VaPiq's Archive (archivePatient in index.html)
let dubbiConfirmed = false;   // set when you confirmed the same action in Dubbi's chat
async function closeFile(t) {
  const e = t.existing_patient, fn = String(e.file_number || '').trim();
  const ok = dubbiConfirmed; dubbiConfirmed = false;
  if (!ok && !confirm(`Close file #${fn} (${e.patient_name}) in VaPiq?\n\nThis archives the patient, like the Archive button in VaPiq.`)) return false;
  if (t.is_test) { toast('Test card — VaPiq not changed. Reply is ready.'); return true; }
  const { data, error } = await sb.from('patients').update({ archived: true }).eq('id', e.id).select('id,file_number');
  if (error) throw error;
  if (!data.length || normFile(data[0].file_number) !== normFile(e.file_number)) throw new Error('patient not found — open VaPiq and close it there');
  await audit('UPDATE', fn, { id: e.id, source: 'assistant', action: 'close_file', task_id: t.id });
  toast(`✓ File #${fn} closed — reply is ready`);
  return true;
}

async function toggleDoc(t, i, k) {
  const docs = JSON.parse(JSON.stringify(t.documents || { files: [] }));
  const f = docs.files[i]; if (!f) return;
  f.types = f.types || [];
  if (k === 'none') f.types = [];
  else f.types = f.types.includes(k) ? f.types.filter(x => x !== k) : [...f.types, k];
  f.checked = true;
  docs.assignment = docs.files.some(x => (x.types || []).includes('assignment'));
  docs.enrollment = docs.files.some(x => (x.types || []).includes('enrollment'));
  docs.unknown = docs.files.filter(x => !(x.types || []).length && !x.checked).length;
  const { error } = await sb.from('email_tasks').update({ documents: docs, reply_body: redraft(t, { documents: docs }) }).eq('id', t.id);
  if (error) throw error;
  t.documents = docs; t.reply_body = redraft(t, { documents: docs }); render();
}

$('main').addEventListener('click', async e => {
  const jump = e.target.closest('[data-jump]');
  if (jump) {
    const j = jump.dataset.jump;
    if (j === 'sched') { tab = 'patients'; render(); window.scrollTo({ top: 0 }); }
    else { const el = $('sec-' + j); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    return;
  }
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const cardEl = btn.closest('.card'); const act = btn.dataset.act;
  const t = S.tasks.find(x => x.id === cardEl.dataset.t) || null;
  const r = S.rows.find(x => x.id === cardEl.dataset.r) || (t ? pendingOf(t) : null);
  try {
    if (act === 'approve') return approve({ t, r }, cardEl, btn);
    if (act === 'doc') return toggleDoc(t, +btn.dataset.i, btn.dataset.k);
    if (act === 'lang') {
      const l = btn.dataset.l; if (l === t.lang) return;
      const body = redraft(t, { lang: l });
      const { error } = await sb.from('email_tasks').update({ lang: l, reply_body: body }).eq('id', t.id);
      if (error) throw error; t.lang = l; t.reply_body = body; return render();
    }
    btn.disabled = true;
    if (act === 'reject') {
      if (r) { await decide(r, 'rejected'); await audit('ASSISTANT_REJECTED', r.record.file_number, { pending_id: r.id, test: r.is_test }); }
      if (t && t.status === 'todo') await setTask(t, 'dismissed');
      toast(r ? 'Rejected' : 'Dismissed');
    }
    if (act === 'dismiss' && r) { await decide(r, 'dismissed'); toast('Dismissed'); }
    if (act === 'ask' || act === 'ask-again') {
      await setTask(t, 'reply_ready', { reply_body: redraft(t), details: { ...(t.details || {}), reply_mode: 'ask_docs' } });
      toast('Draft ready — check it, then tap Send');
    }
    if (act === 'docs-in') { await setTask(t, 'todo'); toast('Back in your list'); }
    if (act === 'applied' || act === 'reply-anyway') {
      await setTask(t, 'reply_ready', { reply_body: redraft(t), details: { ...(t.details || {}), reply_mode: 'confirm' } });
    }
    if (act === 'close-file') {
      if (!(await closeFile(t))) { btn.disabled = false; return; }
      await setTask(t, 'reply_ready');
    }
    if (act === 'dismiss-task') { await setTask(t, 'dismissed'); toast('Dismissed'); }
    if (act === 'no-reply') {
      const ask = t.details && t.details.reply_mode === 'ask_docs';
      if (ask) { await setTask(t, 'todo', { details: { ...t.details, reply_mode: 'confirm' } }); toast('Not sent — back in your list'); }
      else { await setTask(t, 'done'); toast('Marked done — no reply sent'); }
    }
    if (act === 'cancel-send') { await setTask(t, 'reply_ready'); toast('Kept as draft'); }
    if (act === 'send') {
      const body = cardEl.querySelector('[data-k="reply_body"]').value.trim();
      if (!body) { btn.disabled = false; return toast('The reply is empty'); }
      await setTask(t, 'send_approved', { reply_body: body, error: null });
      await audit('ASSISTANT_REPLY_APPROVED', t.file_number, { task_id: t.id, kind: t.kind, test: t.is_test });
      toast(t.is_test ? 'Test reply queued — it will be saved, not sent' : 'Queued — your Mac sends it within ~2 minutes');
    }
    load();
  } catch (err) { btn.disabled = false; toast('Could not save — ' + err.message); }
});

// ── Dubbi: talk or type ─────────────────────────────────────────────────
// Dubbi runs entirely on this phone: no AI service, nothing sent anywhere new.
// It understands a fixed set of requests (English or French) and answers from
// the same data this page shows. For actions ("close file 32604") it proposes;
// when you confirm, it presses that card's own button, so every check the card
// does still applies. Answers are read aloud by the phone's own voices.
// The microphone uses Apple's dictation, so it stays off until you turn it on in ⚙︎.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const PREF = (() => { try { return JSON.parse(localStorage.getItem('dubbi_prefs') || '{}'); } catch { return {}; } })();
const pref = (k, d) => PREF[k] ?? d;
const savePref = (k, v) => { PREF[k] = v; try { localStorage.setItem('dubbi_prefs', JSON.stringify(PREF)); } catch {} };
const D = { rec: null, open: false, lang: pref('lang', 'auto'), fr: false, pending: null };
const micOn = () => !!SR && pref('mic', false);

function openSheet() {
  D.open = true;
  $('sheet').classList.add('on'); $('scrim').classList.add('on');
  $('settings').hidden = true; $('chat').hidden = false; $('micBtn').hidden = !micOn();
  if (!$('chat').children.length) greetDubbi();
  if (micOn()) startListening(); else setTimeout(() => $('askInput').focus({ preventScroll: true }), 300);
}
function closeSheet() {
  D.open = false; stopListening(); speechSynthesis?.cancel();
  $('sheet').classList.remove('on'); $('scrim').classList.remove('on');
}
function bubble(text, who) {
  const b = document.createElement('div'); b.className = 'msg ' + who; b.textContent = text;
  $('chat').appendChild(b); $('chat').scrollTop = $('chat').scrollHeight; return b;
}
function buttons(list) {
  if (!list.length) return;
  const box = document.createElement('div'); box.className = 'suggest';
  list.forEach(([label, fn]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = fn; box.appendChild(b); });
  $('chat').appendChild(box); $('chat').scrollTop = $('chat').scrollHeight;
}
const SUGGEST = { en: ["What's new?", 'Anything overdue?', 'Who needs an appointment?', 'Look for new assignments'],
                  fr: ['Quoi de neuf?', 'Des retards?', 'Qui doit être planifié?', 'Cherche les nouvelles assignations'] };
function greetDubbi() {
  const fr = D.lang === 'fr';
  bubble(fr ? 'Bonjour! Que puis-je faire pour vous?' : 'Hi! What can I do for you?', 'bot');
  buttons(SUGGEST[fr ? 'fr' : 'en'].map(q => [q, () => ask(q)]));
}
async function ask(text) {
  text = String(text || '').trim(); if (!text) return;
  document.querySelectorAll('#chat .suggest').forEach(n => n.remove());
  D.fr = D.lang === 'fr' || (D.lang === 'auto' && /[éèêàçùô]|\b(bonjour|salut|quoi|qui|des|les|dossier|retards?|planifi\w*|rendez|cherche|trouve|aide|aujourd'hui|documents? manquants?)\b/i.test(text));
  bubble(text, 'me'); $('askInput').value = '';
  if (D.pending && YES.test(plain(text))) return runProposal(D.pending);
  if (D.pending && NO.test(plain(text))) return cancelProposal();
  let out;
  try { out = await answer(text); } catch (e) { out = { say: D.fr ? 'Je n’arrive pas à lire vos données. Vérifiez la connexion.' : 'I couldn’t read your data. Check your connection.' }; }
  bubble(out.say, 'bot'); speak(out.say);
  buttons(out.go || []);
  if (out.propose) proposeCard(out.propose);
}

// ── Actions: Dubbi proposes, you confirm, the card's own button does it ──
const YES = /^\s*(yes|yeah|yep|sure|ok(ay)?|confirm(ed)?|do it|go ahead|send it|oui|ouais|d'accord|vas-?y|confirme|envoie)\b[\s.!]*$/;
const NO = /^\s*(no|nope|cancel|stop|don'?t|non|annule|laisse tomber)\b/;
function proposeCard(p) {
  D.pending = p;
  document.querySelectorAll('#chat .prop').forEach(n => n.remove());
  const c = document.createElement('div'); c.className = 'prop';
  c.innerHTML = `<p>${esc(p.describe)}</p><div class="acts" style="margin-top:0"><button class="btn ghost" type="button" data-x="no">${L('Cancel', 'Annuler')}</button><button class="btn pri" type="button" data-x="yes">${L('Confirm', 'Confirmer')}</button></div>`;
  c.addEventListener('click', e => { const x = e.target.closest('[data-x]'); if (!x) return; c.remove(); x.dataset.x === 'yes' ? runProposal(p) : cancelProposal(); });
  $('chat').appendChild(c); $('chat').scrollTop = $('chat').scrollHeight;
}
function cancelProposal() {
  D.pending = null; document.querySelectorAll('#chat .prop').forEach(n => n.remove());
  const m = L('Okay, I didn’t do it.', 'D’accord, je n’ai rien fait.'); bubble(m, 'bot'); speak(m);
}
function runProposal(p) {
  D.pending = null; document.querySelectorAll('#chat .prop').forEach(n => n.remove());
  tab = 'today'; render();
  const el = document.querySelector(p.item.t ? `[data-t="${CSS.escape(p.item.t.id)}"]` : `[data-r="${CSS.escape(p.item.r.id)}"]`);
  const btn = el && el.querySelector(`button[data-act="${p.act}"]`);
  if (!btn || btn.disabled) { const m = L('That item changed in the meantime — nothing was done. Check it in your list.', 'Cet élément a changé — rien n’a été fait. Vérifiez-le dans votre liste.'); bubble(m, 'sys'); speak(m); return; }
  const m = L('Done — check the card.', 'C’est fait — vérifiez la carte.'); bubble(m, 'bot'); speak(m);
  closeSheet();
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  if (p.act === 'close-file') dubbiConfirmed = true;
  btn.click();   // the same code as tapping the button yourself
}
// What can be done to which kind of item (the card's button = act)
const ACTIONS = [
  { re: /\b(ask|request|demande\w*|redemande\w*)\b.*\b(docs?|documents?|forms?|formulaires?)\b/, views: ['new', 'waiting'],
    act: i => i.view === 'waiting' ? 'ask-again' : 'ask',
    ok: i => i.view === 'waiting' || (i.t && docsMissing(i.t) && !unknownDocs(i.t).length),
    why: () => L('both documents are already here, or a scanned fax still needs ticking on the card', 'les deux documents sont là, ou une télécopie numérisée doit être cochée sur la carte'),
    say: i => L(`Prepare the request for the missing documents for file #${fileOf(i)}. You review it, then tap Send.`, `Préparer la demande des documents manquants pour le dossier #${fileOf(i)}. Vous la relisez, puis touchez Envoyer.`) },
  { re: /\b(got|received|recu)\b.*\b(docs?|documents?|forms?|formulaires?)\b/, views: ['waiting'], act: () => 'docs-in',
    say: i => L(`Mark the documents for file #${fileOf(i)} as received and put it back in your list.`, `Marquer les documents du dossier #${fileOf(i)} comme reçus.`) },
  { re: /\b(send|envoie|envoyer|envoyez)\b/, views: ['reply'], act: () => 'send',
    say: i => L(`Send the reply for file #${fileOf(i)} to ${i.t.to_name || i.t.to_address}${(i.t.cc_addresses || []).length ? ', copy to ' + i.t.cc_addresses.join(', ') : ''}. Your Mac sends it within about 2 minutes.`,
      `Envoyer la réponse du dossier #${fileOf(i)} à ${i.t.to_name || i.t.to_address}${(i.t.cc_addresses || []).length ? ', copie à ' + i.t.cc_addresses.join(', ') : ''}. Votre Mac l’envoie d’ici 2 minutes.`) },
  { re: /\b(close|ferme[rz]?|fermeture)\b/, views: ['close'],
    act: i => i.t.existing_patient && i.t.existing_patient.status !== 'Archived' ? 'close-file' : 'reply-anyway',
    say: i => i.t.existing_patient && i.t.existing_patient.status !== 'Archived'
      ? L(`Close file #${fileOf(i)} (${i.t.existing_patient.patient_name}) in VaPiq — it will be archived — and prepare the reply.`, `Fermer le dossier #${fileOf(i)} (${i.t.existing_patient.patient_name}) dans VaPiq — il sera archivé — et préparer la réponse.`)
      : L(`File #${fileOf(i)} is already closed or not in VaPiq. Prepare the reply anyway.`, `Le dossier #${fileOf(i)} est déjà fermé ou absent de VaPiq. Préparer la réponse quand même.`) },
  { re: /\b(appl(y|ied)|appliqu\w*)\b/, views: ['rx'], act: () => 'applied',
    say: i => L(`Mark the prescription for file #${fileOf(i)} as applied and prepare the reply.`, `Marquer l’ordonnance du dossier #${fileOf(i)} comme appliquée et préparer la réponse.`) },
  { re: /\b(add|ajoute\w*)\b/, views: ['new'], act: () => 'approve',
    ok: i => i.r && i.r.status === 'pending' && !addProblems(i).length,
    why: i => !(i.r && i.r.status === 'pending') ? L('there is no form waiting for it', 'aucun formulaire n’attend') : L(`the card is missing ${addProblems(i).join(', ')}`, `il manque ${addProblems(i).join(', ')} sur la carte`),
    say: i => L(`Add ${i.r.record.patient_name}, file #${fileOf(i)}, due ${dayLabel(i.r.record.due_date)}, to VaPiq.`, `Ajouter ${i.r.record.patient_name}, dossier #${fileOf(i)}, dû le ${dayLabel(i.r.record.due_date)}, à VaPiq.`) },
];
function addProblems(i) {
  const rec = (i.r && i.r.record) || {}, out = [];
  if (!rec.patient_name) out.push(L('the name', 'le nom'));
  if (!String(rec.file_number || '').trim()) out.push(L('the file number', 'le numéro de dossier'));
  if (!DOSES.includes(String(rec.dose_prescribed))) out.push(L('the dose', 'la dose'));
  if (!rec.due_date) out.push(L('the due date', 'la date d’échéance'));
  return out;
}
const QUESTION = /^(how|which|what|any|list|show|who|combien|quels?|quelles?|est-ce|y a-t-il)\b|\?\s*$/;
function actionFor(q, num, items) {
  if (QUESTION.test(q)) return null;
  const A = ACTIONS.find(a => a.re.test(q));
  if (!A) return null;
  const cands = items.filter(i => A.views.includes(i.view) && (!num || normFile(fileOf(i)) === normFile(num)));
  if (!cands.length) return { say: num ? L(`There’s nothing like that open for file #${num}.`, `Rien de tel n’est ouvert pour le dossier #${num}.`) : L('There’s nothing like that open right now.', 'Rien de tel n’est ouvert pour le moment.') };
  if (cands.length > 1) return { say: L('Which file? ', 'Quel dossier? ') + cands.slice(0, 6).map(i => '#' + fileOf(i)).join(', ') + '.',
    go: cands.slice(0, 6).map(i => [`#${fileOf(i)}`, () => ask(`${q.replace(/\b\d{4,6}\b/g, '').trim()} ${fileOf(i)}`)]) };
  const i = cands[0];
  if (A.ok && !A.ok(i)) return { say: L(`I can’t do that for file #${fileOf(i)}: `, `Impossible pour le dossier #${fileOf(i)} : `) + A.why(i) + '.', go: [showBtn(i)] };
  const describe = A.say(i);
  return { say: describe + L(' Confirm?', ' Je confirme?'), propose: { item: i, act: A.act(i), describe } };
}

// ── Understanding (fixed rules, no AI) ──────────────────────────────────
const plain = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const L = (en, fr) => D.fr ? fr : en;
const n = (k, en1, enN, fr1, frN) => `${k} ${k === 1 ? L(en1, fr1) : L(enN, frN)}`;
const fileOf = i => String(i.t?.file_number || i.r?.record?.file_number || '').trim();
const KIND = { new: ['new patient', 'nouveau patient'], reply: ['reply to send', 'réponse à envoyer'], 'docs-done': ['confirmation to send', 'confirmation à envoyer'],
  close: ['file to close', 'dossier à fermer'], rx: ['prescription to apply', 'ordonnance à appliquer'], waiting: ['waiting for documents', 'en attente de documents'], dup: ['duplicate', 'doublon'] };
const kindOf = i => L(...KIND[i.view]);
const itemLine = i => `${kindOf(i)}${fileOf(i) ? ' #' + fileOf(i) : ''}${i.late ? ' (' + i.late + ')' : ''}`;
const showBtn = i => [`${L('Show', 'Voir')} #${fileOf(i) || '—'}`, () => showItem(i)];
const listSay = (head, lines, max = 5) => head + ' ' + lines.slice(0, max).join('; ') + (lines.length > max ? L(`; and ${lines.length - max} more.`, `; et ${lines.length - max} autres.`) : '.');

function showItem(i) {
  tab = 'today'; render(); closeSheet();
  const el = document.querySelector(i.t ? `[data-t="${CSS.escape(i.t.id)}"]` : `[data-r="${CSS.escape(i.r.id)}"]`);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function showTab(t, jump) {
  tab = t; render(); closeSheet();
  if (jump) document.getElementById('sec-' + jump)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function briefing() {
  const items = todoItems(), today = ymd(new Date());
  const late = items.filter(i => i.late), todo = items.filter(i => i.view !== 'waiting' && i.view !== 'dup');
  const waiting = items.filter(i => i.view === 'waiting').length, pastDue = S.sched.filter(p => p.due_date < today).length;
  const parts = [];
  if (late.length) parts.push(L(`${late.length} overdue`, `${late.length} en retard`));
  parts.push(todo.length ? n(todo.length, 'thing to do', 'things to do', 'chose à faire', 'choses à faire') : L('nothing to do', 'rien à faire'));
  if (waiting) parts.push(L(`${waiting} waiting for documents`, `${waiting} en attente de documents`));
  if (S.sched.length) parts.push(L(`${n(S.sched.length, 'patient', 'patients')} to schedule${pastDue ? `, ${pastDue} past due` : ''}`,
    `${n(S.sched.length, 'patient', 'patients', 'patient', 'patients')} à planifier${pastDue ? `, dont ${pastDue} en retard` : ''}`));
  if (S.unconf.length) parts.push(L(`${S.unconf.length} to confirm`, `${S.unconf.length} à confirmer`));
  const bt = S.beat?.created_at, mac = !bt ? L(' Your Mac hasn’t checked your email yet.', ' Votre Mac n’a pas encore vérifié vos courriels.')
    : hoursSince(bt) > 0.25 ? L(` Careful: your Mac last checked email ${ago(bt)} ago.`, ` Attention : votre Mac a vérifié les courriels il y a ${ago(bt)}.`) : '';
  const go = late.length ? [[L('Show overdue', 'Voir les retards'), () => showTab('today', 'overdue')]] : todo.length ? [[L('Show to do', 'Voir'), () => showTab('today')]] : [];
  return { say: L('You have ', 'Vous avez ') + parts.join(', ') + '.' + mac, go };
}

async function answer(text) {
  const q = plain(text);
  const items = todoItems(), today = ymd(new Date());
  const num = (q.match(/\b\d{4,6}\b/) || [])[0];
  const action = actionFor(q, num, items);
  if (action) return action;

  if (/\b(help|aide|what can you|que (peux|pouvez)|commands?)\b/.test(q))
    return { say: L('Ask me what’s new, what’s overdue, who needs an appointment, who to confirm, today’s visits, replies to send, missing documents, or a file number or name. I can also do things after you confirm: “close file 32604”, “send the reply for 35290”, “prescription applied 30001”, “ask for the documents for 34734”, “add 34734”.',
      'Demandez-moi : quoi de neuf, les retards, qui planifier, qui confirmer, les visites d’aujourd’hui, les réponses à envoyer, les documents manquants, ou un numéro de dossier ou un nom. Je peux aussi agir après votre confirmation : « ferme le dossier 32604 », « envoie la réponse 35290 », « ordonnance appliquée 30001 », « demande les documents 34734 », « ajoute 34734 ».') };

  if (/(new )?assign|nouvel\w* assign|check (my )?(e-?mails?|mail|inbox)|look for|cherche les|verifie|refresh|actualis|courriels?/.test(q) && !num) {
    await load();
    const now = todoItems().filter(i => i.view === 'new');
    const bt = S.beat?.created_at;
    const mac = !bt ? L('Your Mac hasn’t checked email yet.', 'Votre Mac n’a pas encore vérifié les courriels.')
      : L(`Your Mac last checked email ${ago(bt)}${ago(bt) === 'just now' ? '' : ' ago'}.`, `Votre Mac a vérifié les courriels il y a ${ago(bt)}.`);
    return { say: `${mac} ${now.length ? L(`${n(now.length, 'new patient', 'new patients')} waiting for you.`, `${n(now.length, 'nouveau patient', 'nouveaux patients', 'nouveau patient', 'nouveaux patients')} vous attendent.`) : L('No new assignments.', 'Aucune nouvelle assignation.')}`,
      go: now.slice(0, 4).map(showBtn) };
  }

  if (num) {
    const hits = items.filter(i => normFile(fileOf(i)) === normFile(num));
    const { data: pts } = await sb.from('patients').select('file_number,patient_name,archived,pending,due_date,appointment_date_time,appointment_confirmed').eq('file_number', num).limit(1);
    const p = pts && pts[0];
    let say = '';
    if (p) {
      const st = p.archived ? L('archived', 'archivé') : p.pending ? L('pending', 'en attente') : L('active', 'actif');
      const appt = p.appointment_date_time ? L(`appointment ${dayLabel(String(p.appointment_date_time).slice(0, 10))}${p.appointment_confirmed ? ', confirmed' : ', not confirmed'}`,
        `rendez-vous le ${dayLabel(String(p.appointment_date_time).slice(0, 10))}${p.appointment_confirmed ? ', confirmé' : ', non confirmé'}`)
        : p.due_date ? L(`no appointment, due ${dayLabel(p.due_date)}`, `pas de rendez-vous, dû le ${dayLabel(p.due_date)}`) : L('no appointment', 'pas de rendez-vous');
      say = L(`File ${num} is ${p.patient_name}, ${st}, ${appt}.`, `Le dossier ${num} est ${p.patient_name}, ${st}, ${appt}.`);
    } else say = L(`File ${num} isn’t in VaPiq.`, `Le dossier ${num} n’est pas dans VaPiq.`);
    if (hits.length) say += ' ' + L('Open: ', 'Ouvert : ') + hits.map(kindOf).join(', ') + '.';
    return { say, go: hits.map(showBtn) };
  }

  if (/overdue|late\b|behind|retard/.test(q)) {
    const late = items.filter(i => i.late);
    return late.length ? { say: listSay(L(`${n(late.length, 'item is', 'items are')} overdue:`, `${late.length} en retard :`), late.map(itemLine)), go: late.slice(0, 4).map(showBtn) }
      : { say: L('Nothing is overdue. 👍', 'Rien n’est en retard. 👍') };
  }
  if (/confirm/.test(q)) {
    return S.unconf.length ? { say: listSay(L(`${S.unconf.length} to confirm:`, `${S.unconf.length} à confirmer :`), S.unconf.map(p => `${p.patient_name}, ${dayLabel(String(p.appointment_date_time).slice(0, 10))}`)),
      go: [[L('Open Patients', 'Ouvrir Patients'), () => showTab('patients')]] } : { say: L('All upcoming appointments are confirmed.', 'Tous les rendez-vous à venir sont confirmés.') };
  }
  if (/appointment|schedul|book|planifi|rendez|rdv|\bdue\b/.test(q)) {
    return S.sched.length ? { say: listSay(L(`${S.sched.length} need an appointment:`, `${S.sched.length} à planifier :`), S.sched.map(p => `${p.patient_name}, ${L('due', 'dû le')} ${dayLabel(p.due_date)}${p.due_date < today ? L(' (past due)', ' (en retard)') : ''}`)),
      go: [[L('Open Patients', 'Ouvrir Patients'), () => showTab('patients')]] } : { say: L('Everyone due in the next 14 days has an appointment.', 'Tous les patients dus dans les 14 prochains jours ont un rendez-vous.') };
  }
  if (/visit|today|aujourd/.test(q)) {
    const { data } = await sb.from('patients').select('patient_name,appointment_date_time').eq('archived', false)
      .gte('appointment_date_time', today).lte('appointment_date_time', today + 'T23:59').order('appointment_date_time');
    const v = data || [];
    const hm = iso => String(iso).slice(11, 16);
    return v.length ? { say: listSay(L(`${n(v.length, 'visit', 'visits')} today:`, `${v.length} visite${v.length > 1 ? 's' : ''} aujourd’hui :`), v.map(p => `${hm(p.appointment_date_time)} ${p.patient_name}`), 12) }
      : { say: L('No visits today.', 'Aucune visite aujourd’hui.') };
  }
  if (/document|doc\b|docs\b|waiting|attente|manquant/.test(q)) {
    const w = items.filter(i => i.view === 'waiting' || (i.t && docsMissing(i.t)));
    return w.length ? { say: listSay(L(`${w.length} missing documents:`, `${w.length} avec documents manquants :`), w.map(itemLine)), go: w.slice(0, 4).map(showBtn) }
      : { say: L('No documents missing.', 'Aucun document manquant.') };
  }
  if (/repl|send|envoy|reponse/.test(q)) {
    const r = items.filter(i => i.view === 'reply' || i.view === 'docs-done');
    return r.length ? { say: listSay(L(`${n(r.length, 'reply', 'replies')} ready:`, `${r.length} réponse${r.length > 1 ? 's' : ''} prête${r.length > 1 ? 's' : ''} :`), r.map(itemLine)), go: r.slice(0, 4).map(showBtn) }
      : { say: L('No replies waiting.', 'Aucune réponse en attente.') };
  }
  if (/prescri|ordonnance/.test(q)) {
    const r = items.filter(i => i.view === 'rx');
    return r.length ? { say: listSay(L(`${r.length} to apply:`, `${r.length} à appliquer :`), r.map(itemLine)), go: r.slice(0, 4).map(showBtn) } : { say: L('No prescriptions to apply.', 'Aucune ordonnance à appliquer.') };
  }
  if (/close|ferm/.test(q)) {
    const r = items.filter(i => i.view === 'close');
    return r.length ? { say: listSay(L(`${r.length} to close:`, `${r.length} à fermer :`), r.map(itemLine)), go: r.slice(0, 4).map(showBtn) } : { say: L('No files to close.', 'Aucun dossier à fermer.') };
  }
  const who = q.match(/\b(?:find|look up|search(?: for)?|who is|show me|trouve|cherche|qui est)\s+(?:patient\s+)?([a-z][a-z' -]{1,40})$/);
  if (who && !/^(the |les |des )/.test(who[1])) {
    const name = who[1].trim();
    const { data } = await sb.from('patients').select('file_number,patient_name,archived,due_date,appointment_date_time').ilike('patient_name', `%${name.replace(/[%_]/g, '')}%`).order('archived').limit(6);
    const list = data || [];
    if (!list.length) return { say: L(`No patient matching “${name}”.`, `Aucun patient pour « ${name} ».`) };
    return { say: listSay(L(`${n(list.length, 'match', 'matches')}:`, `${list.length} résultat${list.length > 1 ? 's' : ''} :`), list.map(p => `${p.patient_name} #${String(p.file_number).trim()}${p.archived ? L(' (archived)', ' (archivé)') : ''}`)),
      go: list.slice(0, 4).map(p => [`#${String(p.file_number).trim()}`, () => ask(String(p.file_number).trim())]) };
  }
  if (/new|neuf|brief|summary|resume|status|hello|hi\b|hey|bonjour|salut|morning|matin/.test(q)) return briefing();
  return { say: L('Sorry, I didn’t catch that. Try one of these:', 'Désolé, je n’ai pas compris. Essayez :'), go: SUGGEST[D.fr ? 'fr' : 'en'].map(s => [s, () => ask(s)]) };
}

// Speaking — the iPhone's built-in voices, on the device
function speak(text) {
  if (!pref('speak', true) || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/👍/g, ''));
  u.lang = D.fr ? 'fr-CA' : 'en-CA';
  const v = speechSynthesis.getVoices().find(v => v.lang.replace('_', '-').startsWith(D.fr ? 'fr' : 'en'));
  if (v) u.voice = v;
  u.rate = 1.03;
  speechSynthesis.speak(u);
}

// Listening (only if you turned the microphone on) — tap the mic; it stops when you stop talking
const recLang = () => D.lang === 'fr' ? 'fr-CA' : D.lang === 'en' ? 'en-CA' : (D.fr ? 'fr-CA' : 'en-CA');
function startListening() {
  if (!micOn()) return;
  speechSynthesis?.cancel(); stopListening();
  const r = new SR(); D.rec = r;
  r.lang = recLang(); r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
  let final = '';
  r.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t; else interim += t;
    }
    $('interim').textContent = (final + ' ' + interim).trim();
  };
  r.onerror = e => { if (e.error === 'not-allowed') toast('Allow the microphone for this app in Settings, or type instead.'); };
  r.onend = () => { $('micBtn').classList.remove('live'); $('interim').textContent = ''; D.rec = null; if (final.trim()) ask(final); };
  $('micBtn').classList.add('live');
  try { r.start(); } catch { $('micBtn').classList.remove('live'); }
}
function stopListening() { try { D.rec?.stop(); } catch {} }

// Settings: speaking, language, microphone
function showSettings() {
  $('chat').hidden = true; const s = $('settings'); s.hidden = false;
  s.innerHTML = `
    <div class="setrow"><div>Speak answers aloud<small>Uses your iPhone’s own voices, on the phone.</small></div><input type="checkbox" class="sw" data-p="speak" ${pref('speak', true) ? 'checked' : ''}></div>
    <div class="setrow"><div>Language<small>Auto follows the language you use.</small></div><div class="seg" data-p="lang">${['auto', 'en', 'fr'].map(l => `<button type="button" data-v="${l}" class="${D.lang === l ? 'on' : ''}">${l.toUpperCase()}</button>`).join('')}</div></div>
    <div class="setrow"><div>Microphone<small>${SR ? 'Off by default. Speech goes through Apple’s dictation (like the keyboard’s mic). Turn on only once your privacy officer agrees.' : 'Not available in this browser.'}</small></div><input type="checkbox" class="sw" data-p="mic" ${micOn() ? 'checked' : ''} ${SR ? '' : 'disabled'}></div>
    <p class="note">🔒 Dubbi works only on this phone. No AI service is used and nothing is sent anywhere new. It never acts on its own: it proposes, you confirm.</p>
    <button class="btn ghost" type="button" id="backChat" style="width:100%;margin-top:8px">Back to Dubbi</button>`;
}
$('settings').addEventListener('click', e => {
  const t = e.target;
  if (t.matches('.sw')) { savePref(t.dataset.p, t.checked); $('micBtn').hidden = !micOn(); return; }
  const seg = t.closest('.seg button'); if (seg) { D.lang = seg.dataset.v; savePref('lang', D.lang); showSettings(); return; }
  if (t.id === 'backChat') { $('settings').hidden = true; $('chat').hidden = false; }
});
$('fab').addEventListener('click', openSheet);
$('scrim').addEventListener('click', closeSheet);
$('closeSheet').addEventListener('click', closeSheet);
$('setBtn').addEventListener('click', () => $('settings').hidden ? showSettings() : ($('settings').hidden = true, $('chat').hidden = false));
$('micBtn').addEventListener('click', () => D.rec ? stopListening() : startListening());
$('askForm').addEventListener('submit', e => { e.preventDefault(); ask($('askInput').value); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && D.open) closeSheet(); });

// ── iPhone / browser push ───────────────────────────────────────────────
const b64ToBytes = s => { const p = '='.repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); };
async function setupPush() {
  if (!('serviceWorker' in navigator)) return;
  const reg = await navigator.serviceWorker.register('sw.js');
  navigator.serviceWorker.addEventListener('message', ev => { if (ev.data === 'refresh') load(); });
  const isIOS = /iPhone|iPad/.test(navigator.userAgent);
  const installed = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!self.VAPID_PUBLIC_KEY || !('PushManager' in window)) {
    if (isIOS && !installed) { $('pushBtn').hidden = false; $('pushBtn').onclick = () => toast('On iPhone: Share → Add to Home Screen, then open Dubbi from the Home Screen', 6000); }
    return;
  }
  const sub = await reg.pushManager.getSubscription();
  $('pushBtn').hidden = !!sub && Notification.permission === 'granted';
  $('pushBtn').onclick = async () => {
    try {
      if ((await Notification.requestPermission()) !== 'granted') return toast('Notifications are blocked in Settings');
      const s = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(self.VAPID_PUBLIC_KEY) });
      const j = s.toJSON();
      const { error } = await sb.from('push_subscriptions').upsert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_agent: navigator.userAgent.slice(0, 200) }, { onConflict: 'endpoint' });
      if (error) throw error;
      $('pushBtn').hidden = true;
      toast('🔔 Notifications on for this device');
    } catch (e) { toast('Could not enable notifications — ' + e.message); }
  };
}

sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') start(); });
start();
</script>
