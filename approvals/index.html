<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                 font-src https://fonts.gstatic.com;
                 img-src 'self' data:;
                 connect-src 'self' https://*.supabase.co;
                 media-src 'self' data: blob:;">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dubbi">
  <meta name="theme-color" content="#1B2638" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E141D" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <title>Dubbi</title>
<style>
/* ── Tokens ─────────────────────────────────────────────────────────── */
:root{
  --teal:#2D8C8A;--teal-2:#3AA8A5;--teal-ink:#1C6664;--teal-soft:#E4F3F2;
  --bg:#F4F6F9;--card:#FFFFFF;--card-2:#F8FAFC;--line:#E3E8EF;--ink:#16202E;--ink-2:#55627A;--ink-3:#8C96A8;
  --red:#D1453B;--red-soft:#FDECEA;--amber:#B7741A;--amber-soft:#FFF4DF;--green:#23855A;--green-soft:#E3F4EA;
  --violet:#6B4FD0;--violet-soft:#EFEAFD;--blue:#2E6FD6;--blue-soft:#E7F0FD;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
  --radius:18px;--tabbar:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --teal:#3DB3AF;--teal-2:#58C4C0;--teal-ink:#8FE0DC;--teal-soft:#13302F;
    --bg:#0E141D;--card:#17202D;--card-2:#1C2735;--line:#273447;--ink:#E7ECF3;--ink-2:#9AA8BC;--ink-3:#66748A;
    --red:#F07167;--red-soft:#3A1D1D;--amber:#F2B957;--amber-soft:#3A2E16;--green:#5CCB93;--green-soft:#15302A;
    --violet:#A88BFA;--violet-soft:#2A2345;--blue:#7AA7F5;--blue-soft:#1B2A45;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --teal:#3DB3AF;--teal-2:#58C4C0;--teal-ink:#8FE0DC;--teal-soft:#13302F;
  --bg:#0E141D;--card:#17202D;--card-2:#1C2735;--line:#273447;--ink:#E7ECF3;--ink-2:#9AA8BC;--ink-3:#66748A;
  --red:#F07167;--red-soft:#3A1D1D;--amber:#F2B957;--amber-soft:#3A2E16;--green:#5CCB93;--green-soft:#15302A;
  --violet:#A88BFA;--violet-soft:#2A2345;--blue:#7AA7F5;--blue-soft:#1B2A45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}

/* ── Base: phone-first, never wider than the screen ─────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding:0 env(safe-area-inset-right) calc(var(--tabbar) + env(safe-area-inset-bottom) + 12px) env(safe-area-inset-left)}
/* iPhone zooms into any field under 16px — keep every field at 16px */
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{font-size:16px;max-width:100%;min-width:0}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--teal)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

/* ── Header ─────────────────────────────────────────────────────────── */
header.top{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 0 9px}
.avatar{width:40px;height:40px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;
  background:linear-gradient(140deg,var(--teal-2),var(--teal) 55%,var(--teal-ink));box-shadow:0 4px 14px color-mix(in srgb,var(--teal) 35%,transparent)}
.htxt{flex:1;min-width:0}
.htxt h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htxt .sub{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:18px;height:18px}
.health{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.health.bad .dot{background:var(--red);box-shadow:0 0 0 3px var(--red-soft);animation:pulse 1.6s infinite}
.health.bad{color:var(--red)}
@keyframes pulse{50%{opacity:.35}}

/* ── Summary tiles ──────────────────────────────────────────────────── */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0 4px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 9px;text-align:left;min-width:0;box-shadow:var(--shadow);
  transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tile span{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.hot{background:linear-gradient(160deg,var(--red-soft),var(--card));border-color:color-mix(in srgb,var(--red) 30%,var(--line))}
.tile.hot b{color:var(--red)}
.tile.ok b{color:var(--teal)}
@media (max-width:340px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.tile{padding:9px 8px 8px}.tile b{font-size:22px}.tile span{font-size:11px}}

/* ── Sections & cards ───────────────────────────────────────────────── */
.sec{display:flex;align-items:center;gap:8px;margin:20px 2px 8px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.sec .count{font-size:12px;background:var(--line);color:var(--ink-2);border-radius:999px;padding:1px 8px;letter-spacing:0}
.sec.red{color:var(--red)} .sec.red .count{background:var(--red-soft);color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);
  animation:rise .35s cubic-bezier(.2,.8,.2,1) both;min-width:0;overflow-wrap:anywhere}
.card.overdue{border-color:color-mix(in srgb,var(--red) 45%,var(--line));box-shadow:0 0 0 3px var(--red-soft),var(--shadow)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card,.tile{animation:none!important;transition:none!important}}
.ctop{display:flex;align-items:flex-start;gap:10px}
.cicon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:17px}
.ic-new{background:var(--blue-soft)} .ic-reply{background:var(--teal-soft)} .ic-close{background:var(--amber-soft)}
.ic-rx{background:var(--violet-soft)} .ic-wait{background:var(--card-2)} .ic-dup{background:var(--card-2)}
.ctitle{flex:1;min-width:0}
.ctitle .kind{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.ctitle b{display:block;font-size:16.5px;font-weight:700;line-height:1.25;margin-top:1px}
.meta{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;flex:none;max-width:42%}
.chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--card-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.test{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.chip.late{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.ok{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.note{font-size:13.5px;color:var(--ink-2);margin:10px 0 0}
.warn{background:var(--amber-soft);color:var(--amber);font-size:13px;font-weight:500;border-radius:12px;padding:9px 11px;margin-top:10px}
.warn div+div{margin-top:4px}
.err{background:var(--red-soft);color:var(--red)}

/* documents checklist */
.docs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.doc{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card-2)}
.doc.have{background:var(--green-soft);color:var(--green);border-color:transparent}
.doc.miss{background:var(--red-soft);color:var(--red);border-color:transparent}
.scan{margin-top:8px;border:1px dashed var(--line);border-radius:12px;padding:9px 10px;font-size:13px}
.scan .t{font-weight:600;margin-bottom:6px}
.toggle{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--ink-2);margin:2px 4px 2px 0}
.toggle.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-ink)}

/* facts */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.facts div{background:var(--card-2);border-radius:12px;padding:8px 10px;min-width:0}
.facts span{display:block;font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.facts b{font-size:15px}.facts b.chg{color:var(--red)}

/* form */
details.form{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.form summary{font-size:13.5px;font-weight:700;color:var(--teal);list-style:none;cursor:pointer;padding:4px 0}
details.form summary::-webkit-details-marker{display:none}
details.form summary::after{content:' ›';display:inline-block;transition:transform .2s}
details.form[open] summary::after{transform:rotate(90deg)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;margin-top:8px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.fld input,.fld select{width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:12px;background:var(--card-2);-webkit-appearance:none;appearance:none}
.fld input[type=date]{min-height:44px}
.fld.miss input,.fld.miss select{border-color:var(--red);background:var(--red-soft)}
.fld.miss label{color:var(--red)}
.fld.soft input{border-color:var(--amber);background:var(--amber-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 18%,transparent)}
.fld.soft label{color:var(--amber)}
@media (max-width:420px){.grid{grid-template-columns:minmax(0,1fr)}}

/* reply editor */
.mailhead{font-size:13px;color:var(--ink-2);margin-top:10px;background:var(--card-2);border-radius:12px;padding:8px 10px}
.mailhead div{display:flex;gap:8px;min-width:0}.mailhead div+div{margin-top:3px}
.mailhead span{flex:none;width:52px;font-weight:700;color:var(--ink-3)}
.mailhead em{font-style:normal;min-width:0;overflow-wrap:anywhere}
.case .headline{font-weight:700;margin:10px 0 2px}
.pdfq{margin-top:10px;padding:10px;border-radius:12px;background:var(--card-2)}.pdfq code{font-size:12px;overflow-wrap:anywhere}
.pdfq .row2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pdfq .own{display:flex;gap:6px;margin-top:8px}.pdfq .own input{flex:1;min-width:0}
.cacts{margin-top:10px;display:grid;gap:8px}.cact{display:flex;gap:10px;align-items:flex-start;font-size:14px}.cact input{margin-top:3px;flex:none;width:18px;height:18px}
.cact small{display:block;color:var(--ink-3);font-weight:400;margin-top:2px}
.asked{font-size:14px;line-height:1.45;white-space:pre-line;margin-top:10px;padding:8px 12px;border-left:3px solid var(--line);color:var(--ink-2);max-height:220px;overflow:auto}
.asked span{display:block;font-size:12px;font-weight:700;color:var(--ink-3);margin-bottom:2px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.lang button{border:0;background:none;padding:5px 12px;font-size:12.5px;font-weight:800;color:var(--ink-3)}
.lang button.on{background:var(--teal);color:#fff}
textarea.reply{display:block;width:100%;margin-top:8px;padding:11px 12px;line-height:1.5;border:1.5px solid var(--line);border-radius:14px;background:var(--card-2);resize:vertical;min-height:170px}
textarea.reply:focus,.fld input:focus,.fld select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
pre.sent{white-space:pre-wrap;font:inherit;font-size:14px;background:var(--card-2);border-radius:12px;padding:10px 12px;margin:10px 0 0}

/* actions */
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1 1 30%;min-width:0;min-height:46px;border-radius:14px;border:0;font-weight:800;font-size:14.5px;padding:10px 12px;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,var(--teal-2),var(--teal));color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--teal) 30%,transparent)}
.btn.sec2{background:var(--card-2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--ink-2);border:1px solid var(--line)}
.btn.warnb{background:var(--amber-soft);color:var(--amber)}
.btn:disabled{opacity:.5;pointer-events:none}

/* journey */
.journey{display:flex;align-items:flex-start;margin-top:12px}
.step{flex:1;min-width:0;text-align:center;position:relative;font-size:10px;font-weight:700;color:var(--ink-3);line-height:1.2;overflow-wrap:normal;word-break:keep-all;letter-spacing:-.01em}
.step i{display:grid;place-items:center;width:24px;height:24px;margin:0 auto 5px;border-radius:50%;background:var(--card-2);border:2px solid var(--line);font-style:normal;font-size:12px;position:relative;z-index:1}
.step::before{content:'';position:absolute;top:11px;right:50%;width:100%;height:2px;background:var(--line)}
.step:first-child::before{display:none}
.step.done i{background:var(--teal);border-color:var(--teal);color:#fff}
.step.done::before{background:var(--teal)}
.step.late i{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.step.late{color:var(--red)}
.step.done{color:var(--ink-2)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t b{font-size:14.5px}

/* tab bar */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);
  border-top:1px solid var(--line)}
nav.tabbar .in{display:flex;width:100%;max-width:520px}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--ink-3);position:relative}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--teal)}
.tab .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;font-weight:800}
.empty{text-align:center;padding:48px 16px;color:var(--ink-3)}
.empty .big{font-size:42px;margin-bottom:8px}
.banner{font-size:13px;font-weight:600;background:var(--violet-soft);color:var(--violet);border-radius:12px;padding:9px 12px;margin-top:12px}

/* sign-in */
#login{max-width:400px;margin:12vh auto 0;padding:0 16px}
#login .card{padding:24px}
#login h2{margin:14px 0 4px;font-size:22px}
#login p{margin:0 0 16px;color:var(--ink-2);font-size:14px}
#login .fld{margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;transition:.25s;max-width:calc(100% - 32px);z-index:40;box-shadow:var(--shadow)}
.toast.on{transform:translate(-50%,0);opacity:1}
.skel{height:92px;border-radius:var(--radius);margin-bottom:10px;background:linear-gradient(90deg,var(--card) 25%,var(--card-2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
/* ── Dubbi voice ────────────────────────────────────────────────────── */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(var(--tabbar) + 18px + env(safe-area-inset-bottom));z-index:25;
  width:60px;height:60px;border-radius:50%;border:0;color:#fff;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,var(--teal-2),var(--teal) 60%,var(--teal-ink));box-shadow:0 10px 28px color-mix(in srgb,var(--teal) 45%,transparent)}
.fab svg{width:26px;height:26px}.fab:active{transform:scale(.94)}
/* "Hey Dubbi" chip, next to the Dubbi button */
.wake{position:fixed;right:calc(max(16px,env(safe-area-inset-right)) + 70px);bottom:calc(var(--tabbar) + 32px + env(safe-area-inset-bottom));z-index:25;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:800;
  display:flex;align-items:center;gap:6px;box-shadow:var(--lift,0 4px 14px rgba(0,0,0,.15))}
.wake i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.wake.on i{background:var(--teal);animation:think 1.4s infinite}
.wake.heard{background:var(--teal);color:#fff;border-color:transparent}
@keyframes ring{0%{opacity:.8;transform:scale(.92)}100%{opacity:0;transform:scale(1.25)}}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,16,24,.38);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:640px;margin:0 auto;height:min(86vh,760px);display:flex;flex-direction:column;
  background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px}
.shead{display:flex;align-items:center;gap:10px;padding:6px 16px 10px;border-bottom:1px solid var(--line)}
.shead b{flex:1;font-size:17px}
.chat{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg{max-width:86%;padding:10px 13px;border-radius:18px;font-size:15.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .25s both}
.msg.me{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg .play{display:block;margin-top:8px;border:0;border-radius:999px;padding:7px 13px;font-weight:800;font-size:13px;background:var(--teal);color:#fff}
.msg.sys{align-self:center;background:none;color:var(--ink-3);font-size:13px;padding:2px}
.msg.thinking{display:flex;gap:5px;align-items:center;padding:13px 15px}
.msg.thinking i{width:7px;height:7px;border-radius:50%;background:var(--teal);opacity:.35;animation:think 1.2s infinite}
.msg.thinking i:nth-child(2){animation-delay:.2s}.msg.thinking i:nth-child(3){animation-delay:.4s}
.msg.thinking span{font-size:12.5px;color:var(--ink-3);margin-left:6px}
@keyframes think{0%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.prop{align-self:stretch;background:var(--card);border:1.5px solid var(--teal);border-radius:16px;padding:12px;animation:rise .25s both}
.prop p{margin:0 0 10px;font-size:14.5px}
.card.flash{animation:flash 1.6s ease-out}
/* ✨ AI reply panel */
.ai{margin-top:10px;border:1px solid color-mix(in srgb,var(--violet) 30%,var(--line));border-radius:14px;padding:10px 11px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--violet) 7%,var(--card)),var(--card))}
.ai .h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--violet);text-transform:uppercase;letter-spacing:.05em}
.ai .h span{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink-3)}
.ai pre{white-space:pre-wrap;font:inherit;font-size:14px;line-height:1.5;margin:8px 0 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.ai .row2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ai .chipb,.pdfq .chipb{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 10px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.ai .chipb:active{transform:scale(.96)}
.ai .use{background:var(--g-violet);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px;margin-top:8px}
.ai .own{display:flex;gap:6px;margin-top:8px}.ai .own input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card-2)}
.ai .wait{font-size:13px;color:var(--violet);margin-top:8px;display:flex;align-items:center;gap:8px}
.ai .wait i{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai .err{font-size:12.5px;color:var(--amber);margin-top:8px}
.ai .stale{font-size:12.5px;color:var(--amber);margin-top:8px;font-weight:700}
@keyframes flash{0%,30%{box-shadow:0 0 0 3px var(--teal-2)}100%{box-shadow:0 0 0 0 transparent}}
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.suggest button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-size:14px;font-weight:600;color:var(--ink-2)}
.sbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card)}
.sbar input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:11px 14px;background:var(--card-2)}
.sbar input:focus{outline:none;border-color:var(--teal)}
.mic{width:48px;height:48px;border-radius:50%;border:0;flex:none;display:grid;place-items:center;color:#fff;background:var(--teal)}
.mic svg{width:22px;height:22px}
.mic.live{background:var(--red);animation:breathe 1.2s infinite}
@keyframes breathe{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--red) 25%,transparent)}}
.interim{min-height:20px;padding:0 18px 6px;font-size:14px;color:var(--ink-3);font-style:italic}
.settings{padding:14px 16px;overflow-y:auto;flex:1}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.setrow small{display:block;color:var(--ink-3);font-size:12.5px}
.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw:checked{background:var(--teal)}.sw:checked::after{left:23px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 11px;font-size:13px;font-weight:800;color:var(--ink-3)}
.seg button.on{background:var(--teal);color:#fff}
.vrow{display:flex;gap:6px;align-items:center;margin-top:6px}
.vrow select{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:7px 8px;background:var(--card-2);color:var(--ink);font:inherit;font-size:14px}
.vrow button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px;font-weight:800;color:var(--teal)}
.keybox{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--card-2);border:1px dashed var(--teal);border-radius:12px;padding:10px;word-break:break-all;margin:8px 0}
ol.steps{padding-left:20px;margin:8px 0;font-size:14px;line-height:1.5}

/* ══ VaPiq look (Oct 24, 2026): navy hero, teal gradients, colour per kind, gentle motion ══ */
:root{
  --navy:#1B2638;--navy-mid:#243047;--navy-ink:#0F1726;
  --g-teal:linear-gradient(135deg,#3AA8A5 0%,#2D8C8A 55%,#1E6665 100%);
  --g-red:linear-gradient(135deg,#F2685E 0%,#D1453B 60%,#A8322A 100%);
  --g-amber:linear-gradient(135deg,#F4B451 0%,#D98F24 60%,#B7741A 100%);
  --g-violet:linear-gradient(135deg,#9B83F0 0%,#6B4FD0 60%,#5238B0 100%);
  --g-blue:linear-gradient(135deg,#5C9BF0 0%,#2E6FD6 60%,#1F55AE 100%);
  --g-green:linear-gradient(135deg,#4CC38A 0%,#23855A 100%);
  --page:linear-gradient(170deg,#EAF0F7 0%,#F3F5F9 45%,#F6F7FA 100%);
  --card-grad:linear-gradient(160deg,#FFFFFF 0%,#FAFCFF 100%);
  --lift:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(27,38,56,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:linear-gradient(170deg,#0B111A 0%,#0E141D 50%,#101824 100%);
    --card-grad:linear-gradient(160deg,#1A2432 0%,#16202D 100%);
    --lift:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --page:linear-gradient(170deg,#0B111A 0%,#0E141D 50%,#101824 100%);
  --card-grad:linear-gradient(160deg,#1A2432 0%,#16202D 100%);
  --lift:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35);
}
body{background:var(--bg) var(--page) fixed}

/* Hero header — VaPiq's navy band with a soft teal glow */
header.top{background:linear-gradient(115deg,var(--navy) 0%,var(--navy-mid) 70%,#2A3A55 100%);border-bottom:0;color:#fff;
  box-shadow:0 10px 30px rgba(15,23,38,.28);overflow:hidden;isolation:isolate;border-radius:0 0 22px 22px}
header.top::before{content:'';position:absolute;z-index:-1;width:260px;height:260px;right:-70px;top:-130px;border-radius:50%;
  background:radial-gradient(circle,rgba(58,168,165,.55) 0%,rgba(58,168,165,0) 70%);animation:drift 14s ease-in-out infinite alternate}
header.top::after{content:'';position:absolute;z-index:-1;width:200px;height:200px;left:-80px;bottom:-140px;border-radius:50%;
  background:radial-gradient(circle,rgba(107,79,208,.35) 0%,rgba(107,79,208,0) 70%);animation:drift 18s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-24px,18px) scale(1.08)}}
.hrow{padding:12px 0 14px}
.htxt h1{color:#fff;font-size:21px}
.htxt .sub,.health{color:rgba(255,255,255,.78)}
.health{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px 10px 3px 8px;margin-top:3px}
.health.bad{color:#FFD2CE;background:rgba(209,69,59,.22);border-color:rgba(242,104,94,.45)}
.dot{box-shadow:0 0 0 3px rgba(76,195,138,.25)}
.avatar{background:var(--g-teal);box-shadow:0 0 0 2px rgba(255,255,255,.18),0 6px 18px rgba(45,140,138,.55);position:relative}
.avatar::after{content:'';position:absolute;inset:-4px;border-radius:17px;border:2px solid rgba(58,168,165,.55);animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{opacity:.9;transform:scale(.92)}70%,100%{opacity:0;transform:scale(1.18)}}
header.top .iconbtn{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.16);color:#fff;transition:background .2s,transform .15s}
header.top .iconbtn:hover{background:rgba(255,255,255,.18)}

/* Tiles — each with its own colour; vivid when there is something to do */
.tiles{margin-top:16px}
.tile{position:relative;overflow:hidden;background:var(--card-grad);border:1px solid var(--line);box-shadow:var(--lift);
  animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both;transition:transform .18s,box-shadow .18s}
.tile:nth-child(2){animation-delay:.05s}.tile:nth-child(3){animation-delay:.1s}.tile:nth-child(4){animation-delay:.15s}
.tile:hover{transform:translateY(-2px)}
.tile::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--g-teal)}
.tile.t-overdue::before{background:var(--g-red)}.tile.t-todo::before{background:var(--g-teal)}
.tile.t-waiting::before{background:var(--g-amber)}.tile.t-sched::before{background:var(--g-violet)}
.tile.on{color:#fff;border-color:transparent}
.tile.on span{color:rgba(255,255,255,.88)}
.tile.on b{color:#fff!important;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both .2s}
.tile.on::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 48%,transparent 66%);
  transform:translateX(-120%);animation:shine 3.6s ease-in-out infinite 1s}
.tile.on.t-overdue{background:var(--g-red);box-shadow:0 8px 22px rgba(209,69,59,.38)}
.tile.on.t-todo{background:var(--g-teal);box-shadow:0 8px 22px rgba(45,140,138,.38)}
.tile.on.t-waiting{background:var(--g-amber);box-shadow:0 8px 22px rgba(217,143,36,.36)}
.tile.on.t-sched{background:var(--g-violet);box-shadow:0 8px 22px rgba(107,79,208,.36)}
.tile.on::before{display:none}
.tile.t-overdue.on{animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both,throb 2.4s ease-in-out infinite 1s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes shine{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
@keyframes throb{50%{box-shadow:0 8px 30px rgba(209,69,59,.6)}}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* Section headers — coloured pill and a fading rule */
.sec{color:var(--ink);margin-top:22px}
.sec::after{content:'';flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--line),transparent)}
.sec .count{background:var(--g-teal);color:#fff;box-shadow:0 2px 8px rgba(45,140,138,.35)}
.sec.red{color:var(--red)}
.sec.red .count{background:var(--g-red);color:#fff;box-shadow:0 2px 8px rgba(209,69,59,.35)}
.sec.red::after{background:linear-gradient(90deg,color-mix(in srgb,var(--red) 40%,transparent),transparent)}

/* Cards — gradient surface, colour edge by kind, lift on hover, staggered entrance */
.card{background:var(--card-grad);box-shadow:var(--lift);position:relative;overflow:hidden;
  animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both;transition:transform .18s,box-shadow .18s}
#main .card:nth-of-type(2){animation-delay:.04s}#main .card:nth-of-type(3){animation-delay:.08s}
#main .card:nth-of-type(4){animation-delay:.12s}#main .card:nth-of-type(5){animation-delay:.16s}#main .card:nth-of-type(n+6){animation-delay:.2s}
@media (hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,24,40,.06),0 14px 30px rgba(27,38,56,.14)}}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.card:has(.ic-new)::before{background:var(--g-blue)}
.card:has(.ic-reply)::before{background:var(--g-teal)}
.card:has(.ic-close)::before{background:var(--g-amber)}
.card:has(.ic-rx)::before{background:var(--g-violet)}
.card:has(.ic-wait)::before{background:linear-gradient(180deg,#C9D1DD,#9AA6B8)}
.card.overdue{background:linear-gradient(135deg,color-mix(in srgb,var(--red) 9%,var(--card)) 0%,var(--card) 50%);
  border-color:color-mix(in srgb,var(--red) 40%,var(--line));box-shadow:0 0 0 3px var(--red-soft),var(--lift)}
.card.overdue::before{background:var(--g-red);animation:edge 1.8s ease-in-out infinite}
@keyframes edge{50%{opacity:.45}}
.cicon{box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 3px 10px rgba(16,24,40,.08)}
.ic-new{background:linear-gradient(140deg,#E7F0FD,#D3E3FB)}.ic-reply{background:linear-gradient(140deg,#E4F3F2,#CDEAE8)}
.ic-close{background:linear-gradient(140deg,#FFF4DF,#FDE6BC)}.ic-rx{background:linear-gradient(140deg,#EFEAFD,#DFD6FA)}
.ctitle .kind{color:var(--teal-ink)}
.chip.late{background:var(--g-red);color:#fff;box-shadow:0 2px 8px rgba(209,69,59,.3)}
.chip.ok{background:var(--g-green);color:#fff}
.doc.have{background:linear-gradient(140deg,var(--green-soft),color-mix(in srgb,var(--green) 16%,var(--card)))}
.doc.miss{background:linear-gradient(140deg,var(--red-soft),color-mix(in srgb,var(--red) 14%,var(--card)))}

/* Buttons — teal gradient with a light sweep */
.btn{position:relative;overflow:hidden}
.btn.pri{background:var(--g-teal);box-shadow:0 6px 16px rgba(45,140,138,.38)}
.btn.pri::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);transition:transform .6s}
.btn.pri:hover::after{transform:translateX(120%)}
.btn.warnb{background:var(--g-amber);color:#fff;box-shadow:0 6px 16px rgba(217,143,36,.3)}
.btn.sec2{background:var(--card-grad);box-shadow:0 2px 6px rgba(16,24,40,.06)}
.lang button.on,.seg button.on{background:var(--g-teal)}
.toggle.on{background:linear-gradient(140deg,var(--teal-soft),color-mix(in srgb,var(--teal) 18%,var(--card)))}

/* Journey — 3D status balls (Oct 25, 2026). No border: a gradient under a
   transparent border repeats into it and drew a faint square around the circle. */
.step i{width:26px;height:26px;border:0;font-weight:800;font-size:13px;line-height:1;
  background:radial-gradient(circle at 34% 28%,#fff 0%,rgba(255,255,255,0) 55%),linear-gradient(160deg,#F4F7FB,#DCE3EC);
  box-shadow:inset 0 -2px 3px rgba(16,24,40,.14),inset 0 1px 1px rgba(255,255,255,.9),0 2px 4px rgba(16,24,40,.12)}
.step::before{top:12px}
.step.done i,.step.late i{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.step.done i{background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.65) 0%,rgba(255,255,255,0) 46%),var(--g-teal);
  box-shadow:inset 0 -3px 5px rgba(0,0,0,.28),inset 0 2px 2px rgba(255,255,255,.35),0 4px 9px rgba(30,102,101,.45),0 1px 2px rgba(0,0,0,.18)}
.step.late i{background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.6) 0%,rgba(255,255,255,0) 46%),var(--g-red);
  box-shadow:inset 0 -3px 5px rgba(0,0,0,.28),inset 0 2px 2px rgba(255,255,255,.35),0 4px 9px rgba(168,50,42,.45),0 1px 2px rgba(0,0,0,.18)}
.step.done::before{background:var(--g-teal)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .step:not(.done):not(.late) i{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 55%),linear-gradient(160deg,#243142,#1A2432);
    box-shadow:inset 0 -2px 3px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.08),0 2px 4px rgba(0,0,0,.35)}}
/* Same repeat-into-border fix for other gradient pills */
.tile,.chip,.btn,.doc,.toggle{background-origin:border-box}

/* Tab bar — navy glass with a glowing active pill */
nav.tabbar{background:color-mix(in srgb,var(--navy) 94%,transparent);border-top:1px solid rgba(255,255,255,.08);box-shadow:0 -8px 24px rgba(15,23,38,.25)}
.tab{color:rgba(255,255,255,.55);transition:color .2s}
.tab::before{content:'';position:absolute;top:2px;left:50%;width:44px;height:30px;margin-left:-22px;border-radius:12px;background:var(--g-teal);
  opacity:0;transform:scale(.6);transition:opacity .25s,transform .3s cubic-bezier(.2,1.4,.4,1);z-index:-1;box-shadow:0 4px 14px rgba(45,140,138,.55)}
.tab{isolation:isolate}
.tab.on{color:#fff}
.tab.on::before{opacity:1;transform:none}
.tab .badge{background:var(--g-red);box-shadow:0 2px 6px rgba(209,69,59,.5);animation:pop .4s cubic-bezier(.2,1.6,.4,1) both}

/* Dubbi button and chat */
.fab{background:var(--g-teal);box-shadow:0 10px 28px rgba(45,140,138,.5)}
.fab::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(58,168,165,.6);animation:halo 3.2s ease-out infinite}
.shead{background:linear-gradient(115deg,var(--navy),var(--navy-mid));color:#fff;border-bottom:0;border-radius:24px 24px 0 0;margin-top:-1px}
.sheet .grab{background:rgba(255,255,255,.35);position:relative;z-index:1;margin-bottom:-12px}
.sheet .shead{padding-top:16px}
.shead .iconbtn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.16);color:#fff}
.msg.me{background:var(--g-teal);box-shadow:0 4px 12px rgba(45,140,138,.3)}
.msg.bot{background:var(--card-grad);box-shadow:var(--lift);border-left:3px solid var(--teal)}
.prop{background:var(--card-grad);box-shadow:0 0 0 3px var(--teal-soft),var(--lift)}
.suggest button{background:var(--card-grad);box-shadow:0 2px 6px rgba(16,24,40,.06);transition:transform .15s,border-color .15s}
.suggest button:hover{border-color:var(--teal);transform:translateY(-1px)}
.mic{background:var(--g-teal);box-shadow:0 4px 12px rgba(45,140,138,.4)}
#login .card{box-shadow:0 20px 50px rgba(27,38,56,.18)}

/* Entrance animations only when the app opens or the tab changes — not on the
   automatic refresh every minute (body.intro is set briefly by the script) */
body:not(.intro) .card,body:not(.intro) .tile,body:not(.intro) .tile.on b{animation:none}
body:not(.intro) .tile.t-overdue.on{animation:throb 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

</style>
</head>

<script>
'use strict';
// Same project, key and browser session as VaPiq (index.html).
const SUPABASE_URL = 'https://wqlbmtjbjloxpvsbeqyb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_gcyK2z_8lvbOgHNcJfdX1g_8QCWJ_Xi';
const DOSES = ['7.5', '22.5', '30', '45'];
const INACTIVITY_LIMIT_MS = 30 * 60 * 1000;                     // same as VaPiq
const LATE = { newPatient: 24, reply: 48, docs: 24, asked: 48 }; // hours — same as assistant/config alerts
const HEARTBEAT_ID = '00000000-0000-0000-0000-00000000beef';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const normFile = v => String(v ?? '').trim().toLowerCase();
const hoursSince = iso => iso ? (Date.now() - Date.parse(iso)) / 36e5 : 0;
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
let S = { rows: [], tasks: [], beat: null, sched: [], unconf: [], pts: {}, drafts: {} }, tab = 'today', user = null;
// Your edits to a reply, kept until they're saved: every redraw of the page (refresh,
// Dubbi, a ✨ rewrite arriving) puts them back instead of the older saved text.
const replyText = t => (S.drafts[t.id] ?? t.reply_body) || '';
function keepDrafts() {
  document.querySelectorAll('.card[data-t] textarea[data-k="reply_body"]').forEach(ta => {
    const id = ta.closest('.card').dataset.t, t = S.tasks.find(x => x.id === id);

}
const dropDraft = id => { delete S.drafts[id]; clearTimeout(saveDraft.t[id]); };
// Saved to the database 1.5 s after you stop typing (so Claude and your other devices see it)
function saveDraft(id) {
  clearTimeout(saveDraft.t[id]);
  saveDraft.t[id] = setTimeout(async () => {
    const t = S.tasks.find(x => x.id === id), text = S.drafts[id];
    if (!t || text == null || text === t.reply_body || !['reply_ready', 'failed'].includes(t.status)) return;
    const { error } = await sb.from('email_tasks').update({ reply_body: text }).eq('id', id).in('status', ['reply_ready', 'failed']);
    if (error) return console.warn('[draft]', error.message);
    t.reply_body = text; if (S.drafts[id] === text) delete S.drafts[id];
  }, 1500);
}
saveDraft.t = {};
const sameText = (a, b) => String(a || '').replace(/\s+/g, ' ').trim() === String(b || '').replace(/\s+/g, ' ').trim();

// Plays the entrance animations (app opened / tab changed)
function intro() {
  document.body.classList.add('intro');
  clearTimeout(intro._t); intro._t = setTimeout(() => document.body.classList.remove('intro'), 1500);
}
intro();

function toast(msg, ms = 2800) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}
function ago(iso) {
  if (!iso) return '';
  const m = Math.round((Date.now() - Date.parse(iso)) / 6e4);
  if (m < 1) return 'just now'; if (m < 60) return `${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `${h} h`;
  const d = Math.round(h / 24); return d === 1 ? '1 day' : `${d} days`;
}
function when(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('en-CA', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
const dayLabel = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' }) : '—';

// ── Auth ────────────────────────────────────────────────────────────────
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  user = session?.user || null;
  $('login').hidden = !!user; $('app').hidden = !user;
  if (user) { await load(); setupPush(); resetInactivity(); $('fab').hidden = false; }
  else $('fab').hidden = true;
  if (user) setTimeout(startWake, 800); else stopWake();
}
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  $('pw').value = '';
  if (error) { toast('Sign-in failed — check email and password'); return; }
  start();
});
let _idle;
function resetInactivity() {
  clearTimeout(_idle);
  _idle = setTimeout(async () => { await sb.auth.signOut({ scope: 'local' }); toast('Signed out after 30 minutes of inactivity'); start(); }, INACTIVITY_LIMIT_MS);
}
['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => user && resetInactivity(), { passive: true }));

// ── Data ────────────────────────────────────────────────────────────────
async function load() {
  const since = new Date(Date.now() - 30 * 864e5).toISOString();
  const horizon = ymd(new Date(Date.now() + 14 * 864e5)), today = ymd(new Date());
  const [p, t, h, sc, uc] = await Promise.all([
    sb.from('pending_patients').select('*').gte('created_at', since).order('created_at', { ascending: false }),
    sb.from('email_tasks').select('*').gte('created_at', since).order('created_at', { ascending: false }),
    sb.from('assistant_log').select('created_at,summary').eq('id', HEARTBEAT_ID).maybeSingle(),
    sb.from('patients').select('id,file_number,patient_name,due_date,phone1').eq('archived', false).is('appointment_date_time', null).lte('due_date', horizon).order('due_date'),
    sb.from('patients').select('id,file_number,patient_name,appointment_date_time,phone1').eq('archived', false).eq('appointment_confirmed', false)
      .gte('appointment_date_time', today).lte('appointment_date_time', horizon + 'T23:59').order('appointment_date_time'),
  ]);
  const err = p.error || t.error;
  if (err) { $('main').innerHTML = `<div class="warn err" style="margin-top:16px">Could not load: ${esc(err.message)}. Have all the database setup files in supabase/ been run?</div>`; return; }
  S.rows = p.data; S.tasks = t.data;
  await loadCases();
  for (const id of Object.keys(S.drafts)) { const x = S.tasks.find(y => y.id === id); if (!x || x.reply_body === S.drafts[id] || !['reply_ready', 'failed'].includes(x.status)) dropDraft(id); } S.beat = h.data || null; S.sched = sc.data || []; S.unconf = uc.data || [];
  // Patients added from Dubbi → their appointment status for the journey tracker
  const ids = [...new Set(S.rows.filter(r => r.patient_id && !r.is_test).map(r => r.patient_id))];
  S.pts = {};
  if (ids.length) {
    const { data } = await sb.from('patients').select('id,appointment_date_time,appointment_confirmed,archived').in('id', ids);
    (data || []).forEach(x => { S.pts[String(x.id)] = x; });
  }
  if (!load.done) { load.done = true; intro(); }   // first data → entrance animation
  render();
}

async function auditFull(action, fileNum, detail) {
  const { error } = await sb.from('audit_log').insert({ user_email: user.email, action, patient_file_num: String(fileNum || ''),
    detail: JSON.stringify(detail), created_at: new Date().toISOString() });
  if (error) console.warn('[audit]', error.message);
}
async function audit(action, fileNum, detail) {
  const { error } = await sb.from('audit_log').insert({
    user_email: user.email, action, patient_file_num: String(fileNum || ''),
    detail: detail ? JSON.stringify(detail).slice(0, 500) : null, created_at: new Date().toISOString(),
  });
  if (error) console.warn('[audit]', error.message);
}
async function allPatients() {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from('patients').select('id,file_number,patient_name,archived,pending').range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) return out;
  }
}

// ── Model: what needs you, and how urgently ─────────────────────────────
const pendingOf = t => t && t.pending_id ? S.rows.find(r => r.id === t.pending_id) : null;
const docsMissing = t => t.kind === 'new_patient' && missingDocs(t.documents || {}).length > 0;
const unknownDocs = t => ((t.documents && t.documents.files) || []).filter(f => !(f.types || []).length && !f.checked);
function lateness(item) {
  const { t, r } = item;
  if (r && (!t || t.status === 'todo') && r.status === 'pending' && hoursSince(r.created_at) > LATE.newPatient) return 'Not added · ' + ago(r.created_at);
  if (!t) return '';
  if (t.status === 'failed') return 'Send failed';
  if (t.status === 'reply_ready' && hoursSince(t.decided_at || t.created_at) > LATE.reply) return 'Waiting ' + ago(t.decided_at || t.created_at);
  if (t.status === 'todo' && t.kind !== 'new_patient' && hoursSince(t.created_at) > LATE.newPatient) return 'Waiting ' + ago(t.created_at);
  if (t.status === 'todo' && docsMissing(t) && !t.asked_docs_at && hoursSince(t.created_at) > LATE.docs) return 'Docs missing · ' + ago(t.created_at);
  if (t.status === 'waiting_docs' && hoursSince(t.asked_docs_at) > LATE.asked) return 'Asked ' + ago(t.asked_docs_at) + ' ago';
  return '';
}
// One item per thing to do. A new-patient item = its email task + its pre-filled card.
function todoItems() {
  const items = [], used = new Set();
  for (const t of S.tasks) {
    if (!['todo', 'reply_ready', 'failed', 'waiting_docs'].includes(t.status)) continue;
    const r = pendingOf(t); if (r) used.add(r.id);
    if (t.kind === 'new_patient' && t.status === 'todo' && r && ['rejected', 'dismissed', 'exists'].includes(r.status)) continue;
    let view;
    if (t.status === 'reply_ready' || t.status === 'failed') view = 'reply';
    else if (t.status === 'waiting_docs') view = 'waiting';
    else if (t.kind === 'new_patient') view = (r && r.status === 'approved') ? 'docs-done' : 'new';
    else view = { close_file: 'close', on_hold: 'hold', back: 'back', permanent: 'perm' }[t.kind] || 'rx';
    items.push({ t, r, view });
  }
  for (const r of S.rows) {
    if (used.has(r.id)) continue;
    if (r.status === 'pending') items.push({ t: null, r, view: 'new' });
    else if (r.status === 'exists') items.push({ t: null, r, view: 'dup' });
  }
  items.forEach(i => { i.late = lateness(i); });
  return items;
}
const ORDER = { new: 1, 'docs-done': 2, reply: 2, close: 3, hold: 3, back: 3, perm: 3, rx: 4, waiting: 5, dup: 6 };
const SECTION = { new: 'New patients', 'docs-done': 'Replies to send', reply: 'Replies to send', close: 'Files to close', hold: 'Patient updates', back: 'Patient updates', perm: 'Patient updates', rx: 'Prescriptions to apply', waiting: 'Waiting for documents', dup: 'Duplicates' };

// ── Render ──────────────────────────────────────────────────────────────
function render() {
  keepDrafts();
  const items = todoItems();
  const outbox = S.tasks.filter(t => ['send_approved', 'sending'].includes(t.status));
  const late = items.filter(i => i.late), active = items.filter(i => i.view !== 'waiting' && i.view !== 'dup');
  const today = ymd(new Date());
  const hr = new Date().getHours();
  $('greet').textContent = hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
  const bt = S.beat && S.beat.created_at, stale = !bt || hoursSince(bt) > 0.25;
  $('health').classList.toggle('bad', stale);
  $('healthTxt').textContent = !bt ? 'Mac hasn’t checked in yet'
    : stale ? `Mac offline · last check ${ago(bt)} ago`
    : `Mac checked ${ago(bt)}${ago(bt) === 'just now' ? '' : ' ago'}${S.beat.summary?.mode === 'test' ? ' · test' : ''}`;
  $('health').title = stale ? 'Your Mac assistant reads new emails every 2 minutes. Is your Mac on and awake?' : '';
  const setBadge = (id, n) => { const b = $(id); b.hidden = !n; b.textContent = n; };
  setBadge('b-today', active.length + (S.cases || []).length);
  setBadge('b-patients', S.sched.filter(p => p.due_date < today).length);
  setBadge('b-outbox', outbox.length);
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));

  const anyTest = S.rows.some(r => r.is_test) || S.tasks.some(t => t.is_test);
  const banner = anyTest && tab !== 'patients' ? '<div class="banner">🧪 TEST cards use fake data — VaPiq is never changed and replies are never really sent.</div>' : '';
  let html = '';
  if (tab === 'today') {
    const waiting = items.filter(i => i.view === 'waiting').length;
    html += `<div class="tiles">
      ${tile(late.length, 'Overdue', late.length ? 'hot' : 'ok', 'overdue')}
      ${tile(active.length, 'To do', '', 'todo')}
      ${tile(waiting, 'Waiting docs', '', 'waiting')}
      ${tile(S.sched.length, 'To schedule', S.sched.some(p => p.due_date < today) ? 'hot' : '', 'sched')}
    </div>` + banner;
    if ((S.cases || []).length) html += section('Dubbi’s analysis', S.cases.length, '', 'cases') + S.cases.map(caseCard).join('');
    if (!items.length && !(S.cases || []).length) html += `<div class="empty"><div class="big">✨</div><b>All clear.</b><br>Nothing needs you right now.</div>`;
    else {
      const byAge = (a, b) => String((a.t || a.r).created_at).localeCompare(String((b.t || b.r).created_at));
      if (late.length) html += section('Overdue', late.length, 'red', 'overdue') + late.slice().sort(byAge).map(card).join('');
      const groups = {};
      items.filter(i => !i.late).sort((a, b) => (ORDER[a.view] - ORDER[b.view]) || byAge(a, b))
        .forEach(i => { (groups[SECTION[i.view]] = groups[SECTION[i.view]] || []).push(i); });
      for (const [name, list] of Object.entries(groups)) html += section(name, list.length, '', list[0].view === 'waiting' ? 'waiting' : '') + list.map(card).join('');
    }
  } else if (tab === 'patients') html += patientsView();
  else if (tab === 'outbox') html += banner + (outbox.length ? section('Sending soon', outbox.length) + outbox.map(outboxCard).join('') : `<div class="empty"><div class="big">📭</div>No replies waiting to go out.</div>`);
  else html += banner + historyView();
  $('main').innerHTML = html;
}
// Each tile has its own colour (t-overdue / t-todo / t-waiting / t-sched); "on" = something to do
const tile = (n, label, cls, jump) => `<button class="tile t-${jump} ${n ? 'on' : ''} ${cls}" data-jump="${jump}"><b>${n}</b><span>${label}</span></button>`;
const section = (name, n, cls = '', id = '') => `<div class="sec ${cls}"${id ? ` id="sec-${id}"` : ''}>${esc(name)}<span class="count">${n}</span></div>`;

function from(t) {
  const n = (t?.related_emails || []).length;
  const name = (t?.email_from || '').replace(/<.*>/, '').trim() || t?.to_address || '';
  return `${esc(name)}${n > 1 ? ` · ${n} emails` : ''}`;
}
const fileRef = fn => `#${esc(String(fn || '—').trim())}`;   // file number only — no patient initials
function chips(item) {
  const x = item.t || item.r;
  const old = item.t && S.obsolete && S.obsolete.has(item.t.id);
  return `<div class="chips">${old ? '<span class="chip late" title="A newer email changed this — see Dubbi’s analysis">Superseded</span>' : ''}${x?.is_test ? '<span class="chip test">TEST</span>' : ''}${item.late ? `<span class="chip late">${esc(item.late)}</span>` : `<span class="chip">${ago(x?.created_at)}</span>`}</div>`;
}
function card(item) {
  switch (item.view) {
    case 'new': return newCard(item);
    case 'reply': return replyCard(item);
    case 'docs-done': return docsDoneCard(item);
    case 'waiting': return waitingCard(item);
    case 'close': return closeCard(item);
    case 'hold': case 'back': case 'perm': return updateCard(item);
    case 'rx': return rxCard(item);
    default: return dupCard(item);
  }
}
const cardOpen = (item, icon, cls) => `<article class="card${item.late ? ' overdue' : ''}" data-t="${esc(item.t?.id || '')}" data-r="${esc(item.r?.id || '')}">
  <div class="ctop"><div class="cicon ${cls}" aria-hidden="true">${icon}</div>`;
const warnBox = list => list && list.length ? `<div class="warn">${list.map(w => `<div>⚠️ ${esc(w)}</div>`).join('')}</div>` : '';

// The assistant used the default total doses (nothing marked on the forms)
const defaultTotal = r => (r.warnings || []).some(w => /^Total doses: default|does not divide/.test(w));
function field(r, key, label, opts = {}) {
  const v = r.record[key] ?? '';
  const miss = (r.missing_fields || []).includes(label) || (opts.required && !String(v).trim());
  const soft = !miss && opts.check;   // filled with a default — worth a look

  const id = `${key}-${r.id}`;
  const input = opts.select
    ? `<select id="${id}" data-k="${key}"><option value="">Choose…</option>${opts.select.map(o => `<option${o === v ? ' selected' : ''}>${o}</option>`).join('')}</select>`
    : `<input id="${id}" data-k="${key}" type="${opts.type || 'text'}" value="${esc(v)}" autocomplete="off"${opts.type === 'tel' ? ' inputmode="tel"' : ''}>`;
  return `<div class="fld${opts.wide ? ' wide' : ''}${miss ? ' miss' : soft ? ' soft' : ''}"><label for="${id}">${esc(label)}${miss ? ' · check' : soft ? ' · default' : ''}</label>${input}</div>`;
}
function docsBlock(t) {
  if (!t || !t.documents) return '';
  const d = t.documents, names = { assignment: 'Assignment form', enrollment: 'Enrollment form' };
  let h = `<div class="docs">${['assignment', 'enrollment'].map(k => `<span class="doc ${d[k] ? 'have' : 'miss'}">${d[k] ? '✓' : '✕'} ${names[k]}</span>`).join('')}</div>`;
  (d.files || []).forEach((f, i) => {
    const auto = (f.types || []).length && !f.checked;   // recognised automatically → nothing to ask
    if (auto) return;
    const on = k => (f.types || []).includes(k) ? ' on' : '';

function journey(t) {
  const r = pendingOf(t), p = r && r.patient_id ? S.pts[String(r.patient_id)] : null;
  const docsOk = !docsMissing(t), added = r && r.status === 'approved', replied = t.status === 'sent';
  const booked = !!(p && p.appointment_date_time), confirmed = !!(p && p.appointment_confirmed);
  const steps = [
    { n: 'Email', done: true },
    { n: 'Docs', done: docsOk, late: !docsOk && hoursSince(t.created_at) > LATE.docs },
    { n: 'Added', done: added, late: !added && hoursSince(t.created_at) > LATE.newPatient },
    { n: 'Replied', done: replied, late: !replied && added && hoursSince(r.decided_at) > LATE.reply },
    { n: 'Booked', done: booked, late: !booked && added && !r.is_test && hoursSince(r.decided_at) > 72 },
    { n: 'Confirmed', done: confirmed },
  ];
  return `<div class="journey">${steps.map(s => `<div class="step${s.done ? ' done' : s.late ? ' late' : ''}"><i>${s.done ? '✓' : s.late ? '!' : ''}</i>${s.n}</div>`).join('')}</div>`;
}

async function decide(r, status, extra = {}) {
  const { error } = await sb.from('pending_patients').update({ status, decided_at: new Date().toISOString(), decided_by: user.email, ...extra })
    .eq('id', r.id).in('status', ['pending', 'exists']);
  if (error) throw error;
}
// Moves a task forward only from the status it is in now (no double actions)
async function setTask(t, status, extra = {}) {
  const { error } = await sb.from('email_tasks').update({ status, decided_at: new Date().toISOString(), decided_by: user.email, ...extra })
    .eq('id', t.id).eq('status', t.status);
  if (error) throw error;
}
const sig = t => (t.details && t.details.signature) || '';
function redraft(t, over = {}) {
  const x = { ...t, ...over };
  return draftReply({ kind: x.kind, lang: x.lang, coordinatorName: x.to_name || '', fileNumber: x.file_number, subjectRef: x.subject_ref,
    signature: sig(x), docs: x.kind === 'new_patient' ? (x.documents || {}) : undefined, facts: x.details && x.details.facts });
}

async function approve(item, card, btn) {
  const { r, t } = item;
  const rec = { ...r.record };
  card.querySelectorAll('[data-k]').forEach(el => { if (el.dataset.k in rec) rec[el.dataset.k] = el.value.trim(); });
  rec.file_number = String(rec.file_number || '').trim();
  if (!rec.patient_name) return openDetails(card, 'Patient name is required');
  if (!rec.file_number) return openDetails(card, 'File number is required');
  if (!DOSES.includes(rec.dose_prescribed)) return openDetails(card, 'Choose the dose — check the PDF');
  if (!rec.due_date) return openDetails(card, 'Due date is required');
  btn.disabled = true;
  try {
    // VaPiq's rule, checked right before writing: an existing file number is never duplicated
    const existing = (await allPatients()).find(p => normFile(p.file_number) === normFile(rec.file_number));
    if (existing) {
      const ep = { file_number: existing.file_number, patient_name: existing.patient_name, status: existing.archived ? 'Archived' : existing.pending ? 'Pending' : 'Active' };
      await sb.from('pending_patients').update({ status: 'exists', existing_patient: ep }).eq('id', r.id);
      toast(`#${rec.file_number} already exists — not added`);
      return load();
    }
    if (r.is_test) {
      await decide(r, 'approved');
      await audit('ASSISTANT_TEST_APPROVED', rec.file_number, { pending_id: r.id });
    } else {
      const { data, error } = await sb.from('patients').insert([rec]).select('id').single();
      if (error) throw error;
      await audit('INSERT', rec.file_number, { name: rec.patient_name, source: 'assistant', pending_id: r.id });
      await decide(r, 'approved', { patient_id: String(data.id), record: rec });
    }
    if (t && t.status === 'todo') {
      const ask = docsMissing(t);
      await setTask(t, 'reply_ready', { reply_body: redraft(t), details: { ...(t.details || {}), reply_mode: ask ? 'ask_docs' : 'confirm' } });
    }
    toast(r.is_test ? 'Test card added — VaPiq not changed. Reply is ready.' : `✓ ${rec.patient_name} added to VaPiq — reply is ready`);
    load();
  } catch (e) {
    console.error('[approve]', e);
    toast('Could not save — ' + (e.message || 'please try again'));
  } finally { btn.disabled = false; }
}
function openDetails(card, msg) { const d = card.querySelector('details.form'); if (d) d.open = true; toast(msg); }

// Close file = VaPiq's Archive (archivePatient in index.html)
// Closing a file DELETES the patient from VaPiq (Oct 25, 2026). Always asks first,
// even after "yes" to Dubbi — it cannot be undone. A full copy goes to the audit log.
async function closeFile(t) {
  const e = t.existing_patient, fn = String(e.file_number || '').trim();

  if (t.is_test) { toast('Test card — VaPiq not changed. Reply is ready.'); return true; }
  const { data: row, error: re } = await sb.from('patients').select('*').eq('id', e.id).maybeSingle();
  if (re) throw re;
  if (!row || normFile(row.file_number) !== normFile(e.file_number)) throw new Error('patient not found — it may already be deleted');
  const { error } = await sb.from('patients').delete().eq('id', e.id);
  if (error) throw error;

// "⏸ On hold since 2026-10-25: reason" — the same note VaPiq's Hold button writes
const HOLD_NOTE = /\s*(?:\|\s*)?⏸ On hold since [^|]*/g;
const withoutHold = si => String(si || '').replace(HOLD_NOTE, '').replace(/^\s*\|\s*/, '').trim();
async function applyUpdate(t) {

  else if (t.kind === 'back') fields = { archived: false, special_instructions: withoutHold(row.special_instructions), ...(d.due ? { due_date: d.due } : {}) };

async function toggleDoc(t, i, k) {
  const docs = JSON.parse(JSON.stringify(t.documents || { files: [] }));
  const f = docs.files[i]; if (!f) return;
  f.types = f.types || [];
  if (k === 'none') f.types = [];
  else f.types = f.types.includes(k) ? f.types.filter(x => x !== k) : [...f.types, k];
  f.checked = true;
  docs.assignment = docs.files.some(x => (x.types || []).includes('assignment'));
  docs.enrollment = docs.files.some(x => (x.types || []).includes('enrollment'));
  docs.unknown = docs.files.filter(x => !(x.types || []).length && !x.checked).length;
  const { error } = await sb.from('email_tasks').update({ documents: docs, reply_body: redraft(t, { documents: docs }) }).eq('id', t.id);
  if (error) throw error;
  t.documents = docs; t.reply_body = redraft(t, { documents: docs }); render();
}

// "What is this PDF?" → Dubbi remembers it (this file name, and files named like it), and re-reads the case
async function teachPdf(c, el, i, v) {
  const q = (c.questions || [])[i]; if (!q) return;
  const value = v || (el.querySelector(`[data-own="${i}"]`).value || '').trim();
  if (!value) return toast(L('Choose what it is, or type it', 'Choisissez, ou écrivez ce que c’est'));
  const rows = [{ key: 'pdf:' + q.pdf.trim().toLowerCase(), kind: 'pdf_type', value, created_by: user.email }];
  if (q.pattern && /[a-z]/.test(q.pattern.replace(/name|pdf/g, ''))) rows.push({ key: 'pdfp:' + q.pattern, kind: 'pdf_type', value, created_by: user.email });
  const { error } = await sb.from('dubbi_memory').upsert(rows, { onConflict: 'key' });
  if (error) throw error;
  // the open card that lists this PDF gets it ticked too
  const doc = PDF_TYPES[value] ? PDF_TYPES[value][2] : null;
  for (const t of S.tasks.filter(t => normFile(t.file_number) === normFile(c.file_number) && t.documents && ['todo', 'waiting_docs'].includes(t.status))) {
    const k = (t.documents.files || []).findIndex(f => f.name === q.pdf);
    if (k < 0) continue;
    const docs = JSON.parse(JSON.stringify(t.documents)); docs.files[k].types = doc && doc !== 'copy' ? [doc] : ['copy']; docs.files[k].checked = true;
    docs.assignment = docs.files.some(x => (x.types || []).includes('assignment')); docs.enrollment = docs.files.some(x => (x.types || []).includes('enrollment'));
    docs.unknown = docs.files.filter(x => !(x.types || []).length && !x.checked).length;
    await sb.from('email_tasks').update({ documents: docs, reply_body: redraft(t, { documents: docs }) }).eq('id', t.id);
  }
  await sb.from('dubbi_cases').update({ questions: c.questions.filter((_, j) => j !== i) }).eq('file_number', c.file_number);
  toast(L(`Thanks — I’ll remember ${q.pdf} (and files named like it). Re-reading the emails…`, `Merci — je m’en souviendrai. Je relis les courriels…`));
  await load();
}
// Do the ticked actions, in order, then mark the case done
async function caseDo(c, el) {
  const acts = (c.analysis.actions || []).map((a, i) => ({ ...a, i })).filter(a => el.querySelector(`[data-ai="${a.i}"]`)?.checked);
  if (!acts.length) return toast(L('Nothing ticked', 'Rien de coché'));
  const fn = normFile(c.file_number), done = [];
  const pt = (await allPatients()).find(p => normFile(p.file_number) === fn) || null;
  const needsPt = acts.filter(a => ['back', 'on_hold', 'set_due', 'set_dose', 'add_note', 'clear_appointment', 'close_file', 'call_patient'].includes(a.type));
  if (needsPt.length && !pt) throw new Error(L(`file #${fn} is not in VaPiq`, `le dossier #${fn} est absent de VaPiq`));
  const close = acts.find(a => a.type === 'close_file');
  if (close) {
    const ok = await closeFile({ id: 'case-' + fn, is_test: false, existing_patient: { id: pt.id, file_number: pt.file_number, patient_name: pt.patient_name } });
    if (!ok) return;
    done.push('close_file');
  } else if (pt) {
    const { data: row, error: re } = await sb.from('patients').select('id,file_number,special_instructions').eq('id', pt.id).maybeSingle();
    if (re) throw re;
    let si = row.special_instructions || '';
    const f = {};
    for (const a of acts) {
      if (a.type === 'back') { f.archived = false; si = withoutHold(si); if (a.due) f.due_date = a.due; }
      if (a.type === 'on_hold') { f.archived = true; si = [`⏸ On hold since ${ymd(new Date())}: ${a.reason}`, withoutHold(si)].filter(Boolean).join(' | '); }
      if (a.type === 'set_due') f.due_date = a.due;
      if (a.type === 'set_dose') { f.dose_prescribed = a.dose; if (a.doses_left != null) f.doses_remaining = a.doses_left; }
      if (a.type === 'add_note') si = [`📝 ${ymd(new Date())}: ${a.text}`, si].filter(Boolean).join(' | ');
      if (a.type === 'clear_appointment') { f.appointment_date_time = null; f.appointment_confirmed = false; }
    }
    if (si !== (row.special_instructions || '')) f.special_instructions = si;
    if (Object.keys(f).length) {
      const { error } = await sb.from('patients').update(f).eq('id', pt.id);
      if (error) throw error;
      await audit('UPDATE', pt.file_number, { id: pt.id, source: 'dubbi_case', fields: Object.keys(f), actions: acts.map(a => a.type) });
      done.push(...acts.filter(a => ['back', 'on_hold', 'set_due', 'set_dose', 'add_note', 'clear_appointment'].includes(a.type)).map(a => a.type));
    }
    for (const a of acts.filter(a => a.type === 'call_patient')) {
      const { data: qn } = await sb.from('quick_notes').select('note_text').eq('file_number', String(pt.file_number)).maybeSingle();
      const text = [qn && qn.note_text, `📞 ${a.text}`].filter(Boolean).join('\n');
      const { error } = await sb.from('quick_notes').upsert({ file_number: String(pt.file_number), note_text: text, updated_at: new Date().toISOString() }, { onConflict: 'file_number' });
      if (error) throw error;
      done.push('call_patient');
    }
  }
  // A card Dubbi said to keep whose action was just done (put on hold, off hold, closed) is complete too —
  // unless the reply goes out from it
  const replyEmails = acts.filter(a => a.type === 'reply').map(a => a.email);
  const KIND = { on_hold: 'on_hold', back: 'back', close_file: 'close_file' };
  for (const t of S.tasks.filter(t => normFile(t.file_number) === fn && ['todo'].includes(t.status) && done.some(d => KIND[d] === t.kind) && !replyEmails.includes(t.email_message_id)))
    await setTask(t, 'done', { details: { ...(t.details || {}), by_case: true } });
  for (const a of acts.filter(a => a.type === 'dismiss_card')) {
    const t = S.tasks.find(x => x.id === a.card);
    if (t && ['todo', 'reply_ready', 'failed', 'waiting_docs'].includes(t.status)) { await setTask(t, 'dismissed', { details: { ...(t.details || {}), leave: true, superseded: true } }); done.push('dismiss_card'); }
  }
  for (const a of acts.filter(a => a.type === 'reply')) {
    const text = (el.querySelector(`[data-reply="${a.i}"]`)?.value || a.text).trim();
    if (!text) continue;
    // answer in the existing card for that email if there is one; otherwise a new reply in that thread
    const t = S.tasks.find(x => x.email_message_id === a.email && ['todo', 'reply_ready', 'failed'].includes(x.status));
    if (t) await setTask(t, 'send_approved', { reply_body: text, error: null });
    else {
      const { error } = await sb.from('email_tasks').insert({ kind: 'question', status: 'send_approved', source_key: `case|${a.email}|${Date.now()}`,
        email_message_id: a.email, email_folder: a.folder, email_from: `${a.to_name || ''} <${a.to}>`, email_subject: a.subject, email_date: a.date,
        to_address: a.to, to_name: a.to_name, lang: a.lang === 'fr' ? 'fr' : 'en', file_number: fn, reply_body: text,
        details: { from_case: true }, decided_at: new Date().toISOString(), decided_by: user.email });
      if (error) throw error;
    }
    await audit('ASSISTANT_REPLY_APPROVED', fn, { source: 'dubbi_case', to: a.to });
    done.push('reply');
  }
  await caseClose(c, 'done', { done, at: new Date().toISOString() });
  toast(L(`✓ Done for #${fn}`, `✓ Fait pour le dossier #${fn}`) + (done.includes('reply') ? L(' — reply goes out within ~2 minutes', ' — la réponse part d’ici 2 minutes') : ''));
}
$('main').addEventListener('click', async e => {

  s.innerHTML = `
    <div class="setrow"><div>Dubbi’s brain (Claude)<small>Your questions go to your Mac, which asks Claude with your subscription. Claude sees file numbers, dates and statuses — never names or addresses. Off = quick fixed answers only.</small></div><input type="checkbox" class="sw" data-p="brain" ${brainOn() ? 'checked' : ''}></div>
    <div class="setrow"><div>Speak answers aloud<small>Dubbi reads its answers to you.</small></div><input type="checkbox" class="sw" data-p="speak" ${pref('speak', true) ? 'checked' : ''}></div>
    <div class="setrow"><div>Natural voice (from your Mac)<small>A free AI voice (Kokoro) made on your Mac — nothing goes to any other company. When your Mac is off, the iPhone voice below is used.</small></div><input type="checkbox" class="sw" data-p="macvoice" ${macVoiceOn() ? 'checked' : ''}></div>
    ${[[false, 'English voice'], [true, 'Voix française']].map(([fr, label]) => { const list = voicesFor(fr), cur = voiceFor(fr); return `
    <div class="setrow" style="display:block"><div>${label}<small>${list.some(v => /premium|enhanced|naturelle?|am[ée]lior/i.test(v.name)) ? 'Premium and Enhanced voices sound the most natural.' : 'For a natural voice, download one (see below).'}</small></div>
      <div class="vrow"><select data-voice="${fr ? 'fr' : 'en'}" aria-label="${label}">${list.length ? list.map(v => `<option value="${esc(v.voiceURI)}"${cur && v.voiceURI === cur.voiceURI ? ' selected' : ''}>${esc(v.name)} · ${esc(v.lang.replace('_', '-'))}</option>`).join('') : '<option>Loading voices…</option>'}</select>
      <button type="button" data-try="${fr ? 'fr' : 'en'}" aria-label="Play a sample">▶</button></div></div>`; }).join('')}
    <p class="note">🎙️ <b>Most natural voice (free, stays on your phone):</b> iPhone Settings → Accessibility → Spoken Content → Voices → English → tap <b>Ava</b> or <b>Zoe</b> → download <b>Premium</b>. For French: Français (Canada) → <b>Amélie</b> or <b>Nicolas</b> (Enhanced). Then reopen Dubbi and pick it here.</p>
    <div class="setrow"><div>Language<small>Auto follows the language you use.</small></div><div class="seg" data-p="lang">${['auto', 'en', 'fr'].map(l => `<button type="button" data-v="${l}" class="${D.lang === l ? 'on' : ''}">${l.toUpperCase()}</button>`).join('')}</div></div>
    ${SR ? `<div class="setrow"><div>“Hey Dubbi”<small>While Dubbi is open on screen, say “Hey Dubbi” (or “Dis Dubbi”) and your question — no tap. Needs the microphone on. Off by default: while waiting, the iPhone’s speech recognition hears what’s around you (on iPhone it may go to Apple’s dictation, like the keyboard mic), so leave it off in patients’ homes unless your privacy officer agrees. Stops when you leave the app or lock the phone.</small></div><input type="checkbox" class="sw" data-p="wake" ${pref('wake', false) ? 'checked' : ''} ${micOn() ? '' : 'disabled'}></div>` : ''}
    <div class="setrow"><div>Microphone<small>${SR ? 'Off by default. Speech goes through Apple’s dictation (like the keyboard’s mic). Turn on only once your privacy officer agrees.' : 'Not available in this browser.'}</small></div><input type="checkbox" class="sw" data-p="mic" ${micOn() ? 'checked' : ''} ${SR ? '' : 'disabled'}></div>
    <p class="note">🔒 With the brain on, your question goes through your VaPiq database to your own Mac; names are swapped for file numbers before Claude sees it, and put back on your Mac. With it off, Dubbi works only on this phone. Either way it never acts on its own: it proposes, you confirm.</p>
    <button class="btn ghost" type="button" id="backChat" style="width:100%;margin-top:8px">Back to Dubbi</button>`;
}
$('settings').addEventListener('change', e => {
  const sel = e.target.closest('select[data-voice]');
  if (sel) { savePref('voice_' + sel.dataset.voice, sel.value); sel.nextElementSibling.click(); }
});
$('settings').addEventListener('click', e => {
  const t = e.target;
  if (t.matches('.sw')) { savePref(t.dataset.p, t.checked); $('micBtn').hidden = !micOn(); if (t.dataset.p === 'mic' || t.dataset.p === 'wake') { if (!micOn()) savePref('wake', false); showSettings(); } return; }
  const tr = t.closest('[data-try]');
  if (tr) { const fr = tr.dataset.try === 'fr', was = D.fr; D.fr = fr;
    speak(fr ? 'Bonjour! Le dossier 35037 est dû jeudi, et il n’a pas encore de rendez-vous.' : 'Hi! File 35037 is due Thursday, and has no appointment yet. Want me to show it?', true); D.fr = was; return; }
  const seg = t.closest('.seg button'); if (seg) { D.lang = seg.dataset.v; savePref('lang', D.lang); showSettings(); return; }
  if (t.id === 'backChat') { $('settings').hidden = true; $('chat').hidden = false; }
});
$('fab').addEventListener('click', () => openSheet());
$('wakeChip').addEventListener('click', () => { W.fails = 0; stopWake(); startWake(); });
$('scrim').addEventListener('click', closeSheet);
$('closeSheet').addEventListener('click', closeSheet);
$('setBtn').addEventListener('click', () => $('settings').hidden ? showSettings() : ($('settings').hidden = true, $('chat').hidden = false));
$('micBtn').addEventListener('click', () => D.rec ? stopListening() : startListening());
$('askForm').addEventListener('submit', e => { e.preventDefault(); unlockAll(); ask($('askInput').value); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && D.open) closeSheet(); });

// ── iPhone / browser push ───────────────────────────────────────────────
const b64ToBytes = s => { const p = '='.repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); };
async function setupPush() {
  if (!('serviceWorker' in navigator)) return;
  const reg = await navigator.serviceWorker.register('sw.js');
  navigator.serviceWorker.addEventListener('message', ev => { if (ev.data === 'refresh') load(); });
  const isIOS = /iPhone|iPad/.test(navigator.userAgent);
  const installed = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!self.VAPID_PUBLIC_KEY || !('PushManager' in window)) {
    if (isIOS && !installed) { $('pushBtn').hidden = false; $('pushBtn').onclick = () => toast('On iPhone: Share → Add to Home Screen, then open Dubbi from the Home Screen', 6000); }
    return;
  }
  const sub = await reg.pushManager.getSubscription();
  $('pushBtn').hidden = !!sub && Notification.permission === 'granted';
  $('pushBtn').onclick = async () => {
    try {
      if ((await Notification.requestPermission()) !== 'granted') return toast('Notifications are blocked in Settings');
      const s = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(self.VAPID_PUBLIC_KEY) });
      const j = s.toJSON();
      const { error } = await sb.from('push_subscriptions').upsert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_agent: navigator.userAgent.slice(0, 200) }, { onConflict: 'endpoint' });
      if (error) throw error;
      $('pushBtn').hidden = true;
      toast('🔔 Notifications on for this device');
    } catch (e) { toast('Could not enable notifications — ' + e.message); }
  };
}

sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') start(); });
start();
</script>
